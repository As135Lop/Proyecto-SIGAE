<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Eventos - SIGAE</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --verde-fondo: #c8cdb8;
            --verde-panel: #8a9b6e;
            --cafe-btn: #8b5e3c;
            --negro-borde: #1a1a1a;
            --fondo-box: rgba(139, 144, 124, 0.92);
            --cafe-edit: #5d4037;
            --gris-ph: #888;
            --verde-cuadros-grandes: #5f6f4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--verde-fondo);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 220px;
            min-width: 220px;
            border-right: 2px solid var(--negro-borde);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 0;
            background-color: var(--verde-panel);
            z-index: 20;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .logo-sigae {
            width: 130px;
            height: 130px;
            margin-bottom: 16px;
            border-radius: 50%;
            border: 3px solid var(--negro-borde);
            object-fit: cover;
            background: #3a4a25;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 85%;
        }

        .btn-nav {
            background-color: var(--cafe-btn);
            border: 2px solid var(--negro-borde);
            padding: 10px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            text-decoration: none;
            color: #000;
            display: block;
            border-radius: 3px;
        }

        .btn-nav:hover,
        .btn-nav.active {
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.75);
            filter: brightness(1.2);
            transform: scale(1.04);
        }

        .logout-container {
            margin-top: auto;
            width: 85%;
            padding: 12px 0 18px;
        }

        /* ── MAIN ── */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        /* ── HEADER ── */
        .header {
            height: 78px;
            border-bottom: 2px solid var(--negro-borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background-color: var(--verde-panel);
            z-index: 10;
            flex-shrink: 0;
            flex-wrap: nowrap;
            overflow: hidden;
            gap: 6px;
        }

        .user-info {
            font-size: 13px;
            line-height: 1.7;
            min-width: 150px;
        }

        .user-info strong {
            font-weight: 700;
        }

        .valor {
            color: var(--gris-ph);
            font-style: italic;
        }

        .valor.activo {
            color: inherit;
            font-style: normal;
        }

        .social-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .asociacion-titulo {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
        }

        .social-icons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .social-icons a {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .social-icons a:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
        }

        .social-icons a svg {
            width: 36px;
            height: 36px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .logo-safime {
            height: 200px;
            width: auto;
            max-width: 160px;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.2));
        }

        .settings-icon {
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.35s;
            flex-shrink: 0;
            line-height: 1;
        }

        .settings-icon:hover {
            transform: rotate(65deg);
        }

        /* ── ÁREA PRINCIPAL ── */
        .page-area {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .fime-bg-logo {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 570px;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }

        /* ── PANEL EVENTO ── */
        .event-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1;
        }

        .event-panel {
            background-color: var(--verde-cuadros-grandes);
            border: 2px solid var(--negro-borde);
            width: 80%;
            max-width: 800px;
            padding: 40px;
            border-radius: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.2);
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .label-text {
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
            font-family: 'Playfair Display', serif;
        }

        .input-capsule {
            background-color: rgba(255, 255, 255, 0.15);
            border: 2px solid var(--negro-borde);
            border-radius: 20px;
            padding: 8px 15px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            outline: none;
            color: #1a1a1a;
        }

        .input-capsule::placeholder {
            color: #555;
        }

        .event-name-input {
            width: 60%;
        }

        .description-box {
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--negro-borde);
            border-radius: 30px;
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .description-textarea {
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            resize: none;
            width: 100%;
            height: 150px;
            font-style: italic;
            color: #1a1a1a;
        }

        .description-textarea::placeholder {
            color: #555;
        }

        .controls-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .small-input {
            width: 60px;
            text-align: center;
        }

        .select-capsule {
            cursor: pointer;
        }

        .btn-create {
            background-color: var(--cafe-btn);
            border: 2px solid var(--negro-borde);
            border-radius: 25px;
            padding: 10px 50px;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.25s ease;
            margin: 0 auto;
            color: #000;
        }

        .btn-create:hover {
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.75);
            filter: brightness(1.2);
            transform: scale(1.04);
        }

        .mini-logo-aso {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 55px;
            border-radius: 50%;
            border: 1.5px solid var(--negro-borde);
        }

        /* ── RESPONSIVO MÓVIL ── */
        @media (max-width: 700px) {
            body {
                flex-direction: column;
                overflow-y: auto;
            }

            .sidebar {
                width: 100%;
                min-width: unset;
                flex-direction: row;
                flex-wrap: nowrap;
                overflow: hidden;
                justify-content: center;
                padding: 10px;
                border-right: none;
                border-bottom: 2px solid var(--negro-borde);
            }

            .logo-sigae {
                width: 70px;
                height: 70px;
                margin: 0 10px 0 0;
            }

            .nav-buttons {
                flex-direction: row;
                flex-wrap: nowrap;
                overflow: hidden;
                justify-content: center;
                gap: 6px;
                width: auto;
            }

            .btn-nav {
                font-size: 12px;
                padding: 7px 10px;
            }

            .logout-container {
                width: auto;
                padding: 0;
            }

            .main-content {
                overflow: visible;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                padding: 10px 12px;
                height: auto;
            }

            .page-area {
                overflow: visible;
            }

            .event-panel {
                width: 98%;
                padding: 20px;
            }

            .event-name-input {
                width: 100%;
            }

            .input-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .controls-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .fime-bg-logo {
                width: 280px;
            }
        }
    </style>
</head>

<body>

    <!-- ══ SIDEBAR ══ -->
    <aside class="sidebar">
        <img src="../Img/Logo de equipo.jpeg" alt="Logo SIGAE" class="logo-sigae">
        <nav class="nav-buttons">
            <a href="Inicio.html" class="btn-nav">Inicio</a>
            <a href="Miembros.html" class="btn-nav">Miembros</a>
            <a href="Administrador.html" class="btn-nav">Administradores</a>
            <a href="Crea_Event.html" class="btn-nav active">Eventos</a>
            <a href="Crear_QR.html" class="btn-nav">QR</a>

        <div class="logout-container">
            <a href="../Login.html" class="btn-nav" style="display:block;">Cerrar sesión</a>
        </div>
    </aside>

    <!-- ══ MAIN ══ -->
    <div class="main-content">

        <!-- HEADER -->
        <header class="header">
            <div class="user-info">
                <strong>Nombre:</strong> <span id="user-nombre" class="valor">Usuario</span><br>
                <strong>Correo:</strong> <span id="user-correo" class="valor">correo@ejemplo.com</span>
            </div>

            <div class="social-center">
                <span class="asociacion-titulo">Asociación Cadereyta</span>
                <div class="social-icons">
                    <a href="#" target="_blank" title="WhatsApp" style="background:#25D366; border-radius:10px;">

                        </svg>
                    </a>
                    <a href="#" target="_blank" title="Instagram"

                    </a>
                </div>
            </div>

            <div class="header-right">
                <img src="../Img/SAFIMEpng.png" alt="SAFIME" class="logo-safime">
                <i class="fa-solid fa-gear settings-icon" title="Configuración" onclick="irAConfig()"></i>
            </div>
        </header>

        <!-- ÁREA PRINCIPAL -->
        <div class="page-area">
            <img src="../Img/fime-logo-cel.png" alt="FIME fondo" class="fime-bg-logo">

            <main class="event-container">
                <section class="event-panel">

                    <div class="input-row">
                        <span class="label-text">Eventos:</span>
                        <input type="text" id="event-name" class="input-capsule event-name-input"
                            placeholder="Nombre del evento">
                    </div>

                    <div class="description-box">
                        <span class="label-text">Descripción del evento:</span>
                        <textarea id="event-desc" class="description-textarea"
                            placeholder="Escribe aquí los detalles del evento..."></textarea>
                    </div>

                    <div class="controls-row">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span class="label-text">Puntos:</span>
                            <input type="number" id="event-points" class="input-capsule small-input" value="10">
                        </div>

                        <div style="display:flex; align-items:center; gap:10px;">
                            <span class="label-text">Horario:</span>
                            <select id="event-time" class="input-capsule select-capsule">
                                <option value="M1-M3">M1-M3</option>
                                <option value="M4-M6">M4-M6</option>
                                <option value="V1-V3">V1-V3</option>
                                <option value="V4-V5">V4-V5</option>
                                <option value="N1-N3">N1-N3</option>
                                <option value="N4-N5">N4-N5</option>
                            </select>
                        </div>

                        <div style="display:flex; align-items:center; gap:10px;">
                            <span class="label-text">Fecha:</span>
                            <input type="date" id="event-date" class="input-capsule">
                        </div>
                    </div>

                    <button class="btn-create" onclick="createEvent()">Crear</button>

                    <img src="../Img/Logo de la Aso.jpeg" alt="Aso Logo" class="mini-logo-aso">
                </section>
            </main>
        </div>
    </div>

    <script>
        /* ── SESIÓN ── */
        function setUsuario(nombre, correo) {
            const elN = document.getElementById('user-nombre');
            const elC = document.getElementById('user-correo');
            if (nombre) { elN.textContent = nombre; elN.classList.add('activo'); }
            if (correo) { elC.textContent = correo; elC.classList.add('activo'); }
        }
        setUsuario(
            sessionStorage.getItem('nombre'),
            sessionStorage.getItem('correo')
        );

        function irAConfig() {
            sessionStorage.setItem('paginaAnterior', window.location.href);
            window.location.href = '../Configuracion.html';
        }

        /* ── FECHA HOY ── */
        document.getElementById('event-date').valueAsDate = new Date();

        /* ── CREAR EVENTO ── */
        async function createEvent() {
            const name = document.getElementById('event-name').value;
            const desc = document.getElementById('event-desc').value;
            const points = document.getElementById('event-points').value;
            const time = document.getElementById('event-time').value;
            const date = document.getElementById('event-date').value;

            if (!name || !desc || !date) {
                alert("Por favor, completa los campos de nombre, descripción y fecha.");
                return;
            }

            const datosEvento = {
                nombre: name,
                descripcion: desc,
                puntos: parseInt(points),
                horario: time,
                fecha: date
            };

            try {
                const response = await fetch('http://localhost:3000/api/crear-evento', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosEvento)
                });

                const result = await response.json();

                if (response.ok) {
                    alert("¡Evento '" + name + "' guardado en SIGAE con éxito!");
                    document.getElementById('event-name').value = '';
                    document.getElementById('event-desc').value = '';
                    document.getElementById('event-points').value = '10';
                } else {
                    alert("Error en el servidor: " + result.error);
                }
            } catch (error) {
                console.error("Error de conexión:", error);
                alert("No se pudo conectar con el servidor. ¿Revisaste si Node.js está corriendo?");
            }
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar QR - SIGAE</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --verde-fondo: #8b907c;
            --verde-paneles: #8a9b6e;
            --cafe-botones: #8b5e3c;
            --borde-negro: #1a1a1a;
            --verde-cuadros-grandes: #5f6f4a;
            --verde-cuadritos-nombres: #8b907c;
            --beige-botones: #f3d4b1;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Lora', serif;
            background-color: var(--verde-fondo);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 220px;
            border-right: 2px solid var(--borde-negro);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            background-color: var(--verde-paneles);
            z-index: 10;
        }

        .logo-sigae {
            width: 100px;
            margin-bottom: 20px;
            border-radius: 50%;
            border: 2px solid var(--borde-negro);
        }

        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 85%;
        }

        .btn-nav {
            background-color: var(--cafe-botones);
            border: 2px solid var(--borde-negro);
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            color: black;
            transition: 0.3s;
        }

        .btn-nav:hover {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            transform: scale(1.05);
        }

        /* --- HEADER --- */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            height: 100px;
            border-bottom: 2px solid var(--borde-negro);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            background-color: var(--verde-paneles);
            z-index: 10;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-safime {
            height: 220px;
            width: auto;
            object-fit: contain;
        }

        .fa-gear {
            font-size: 28px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .fa-gear:hover {
            transform: rotate(90deg);
        }

        .social-icons {
            display: flex;
            gap: 15px;
            font-size: 24px;
        }

        .social-icons a {
            background-color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--borde-negro);
            text-decoration: none;
        }

        /* --- CONTENIDO CENTRAL (QR) --- */
        .qr-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1;
            position: relative;
        }

        .fime-bg-logo {
            position: absolute;
            left: 50%;
            top: 55%;
            transform: translate(-50%, -50%);
            width: 700px;
            opacity: 0.3;
            z-index: 0;
            pointer-events: none;
        }

        .qr-box {
            background-color: var(--verde-paneles);
            border: 2px solid var(--borde-negro);
            width: 700px;
            padding: 40px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .qr-box h1 {
            font-size: 3rem;
            margin: 0 0 30px 0;
            font-weight: bold;
        }

        .qr-columns {
            display: flex;
            width: 100%;
            justify-content: space-around;
            align-items: center;
        }

        .qr-inputs {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .input-group label {
            font-size: 1.2rem;
            min-width: 80px;
        }

        .select-field {
            background-color: #adbca1;
            border: 2px solid var(--borde-negro);
            padding: 8px;
            width: 180px;
            font-family: 'Lora', serif;
        }

        .btn-crear {
            background-color: #c9b48b;
            border: 2px solid var(--borde-negro);
            border-radius: 20px;
            padding: 10px 40px;
            font-weight: bold;
            font-family: 'Lora', serif;
            cursor: pointer;
            margin-top: 30px;
            align-self: center;
        }

        /* Pantalla QR y Botón Agrandar */
        .qr-display-container {
            width: 220px;
            height: 220px;
            background-color: #f0f0f0;
            border: 2px solid var(--borde-negro);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .qr-display-container img {
            width: 85%;
            height: 85%;
        }

        .btn-expand {
            position: absolute;
            top: 10px;
            left: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--borde-negro);
            transition: transform 0.2s;
        }

        .btn-expand:hover {
            transform: scale(1.2);
        }

        .mini-logo-aso {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 60px;
            border-radius: 50%;
        }

        /* MODAL (PANTALLA COMPLETA QR) */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border: 4px solid var(--borde-negro);
            position: relative;
        }

        .modal-content img {
            width: 500px;
            height: 500px;
        }

        .close-modal {
            position: absolute;
            top: -20px;
            right: -20px;
            background: var(--cafe-botones);
            color: white;
            border: 2px solid black;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <img src="../Img/Logo de equipo.jpeg" alt="Logo SIGAE" class="logo-sigae">
        <nav class="nav-buttons">
            <a href="Inicio.html" class="btn-nav">Inicio</a>
            <a href="Miembros.html" class="btn-nav">Miembros</a>
            <a href="Administrador.html" class="btn-nav">Administradores</a>
            <a href="Crea_Event.html" class="btn-nav">Eventos</a>
            <a href="Crear_QR.html" class="btn-nav" style="box-shadow: 0 0 10px white;">QR</a>
            <a href="Lista_Asisten.html" class="btn-nav">Lista de asistencia</a>
            <a href="Voluntariado.html" class="btn-nav">Voluntariado</a>
        </nav>
        <div style="margin-top: auto; width: 85%; padding-bottom: 20px;">
            <a href="../Login.html" class="btn-nav" style="display: block;">Cerrar sesión</a>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="header">
            <div class="user-info">
                <strong>Nombre:</strong> Salazar Slytherin<br>
                <strong>Correo:</strong> Sa_sly95_12@gamil.com
            </div>
            <div style="text-align: center;">
                <span style="font-weight: bold; font-size: 22px;">Asociación Cadereyta</span>
                <div class="social-icons" style="justify-content: center; margin-top: 5px;">
                    <a href="#"><i class="fa-brands fa-whatsapp" style="color: #25D366;"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram" style="color: #E1306C;"></i></a>
                </div>
            </div>
            <div class="header-right">
                <img src="../Img/SAFIMEpng.png" alt="SAFIME" class="logo-safime">
                <i class="fa-solid fa-gear"></i>
            </div>
        </header>

        <img src="../Img/fime-logo-cel.png" alt="FIME Background" class="fime-bg-logo">

        <!-- AQUÍ ENTRA EL CUADRO DEL QR -->
        <main class="qr-container">
            <section class="qr-box">
                <h1>QR</h1>
                <div class="qr-columns">
                    <div class="qr-inputs">
                        <div class="input-group">
                            <label>Eventos:</label>
                            <select class="select-field">
                                <option>Seleccionar...</option>
                                <option>Evento 4</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Fecha:</label>
                            <select class="select-field">
                                <option>Seleccionar...</option>
                                <option>04/05/2026</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Duracion:</label>
                            <select class="select-field">
                                <option>Seleccionar...</option>
                                <option>1 Hora</option>
                            </select>
                        </div>
                        <button class="btn-crear">Crear</button>
                    </div>

                    <div class="qr-display-container">
                        <button class="btn-expand" onclick="openQR()"><i class="fa-solid fa-expand"></i></button>
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=SIGAE-EVENTO-4"
                            alt="QR Code">
                    </div>
                </div>
                <img src="../Img/Logo de la Aso.jpeg" alt="Asociación" class="mini-logo-aso">
            </section>
        </main>
    </div>

    <!-- Modal para agrandar el código -->
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeQR()">X</button>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=SIGAE-EVENTO-4" alt="QR Grande">
        </div>
    </div>

    <script>
        function openQR() {
            document.getElementById('qrModal').style.display = 'flex';
        }
        function closeQR() {
            document.getElementById('qrModal').style.display = 'none';
        }
    </script>
</body>

</html>

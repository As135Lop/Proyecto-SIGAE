<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar QR - SIGAE</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --verde-fondo: #8b907c;
            --verde-paneles: #8a9b6e;
            --cafe-botones: #8b5e3c;
            --borde-negro: #1a1a1a;
            --capsula-bg: #adbca1;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Lora', serif;
            background-color: var(--verde-fondo);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 220px;
            border-right: 2px solid var(--borde-negro);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            background-color: var(--verde-paneles);
        }

        .logo-sigae { width: 100px; margin-bottom: 20px; border-radius: 50%; }

        .nav-buttons { display: flex; flex-direction: column; gap: 12px; width: 85%; }

        .btn-nav {
            background-color: var(--cafe-botones);
            border: 2px solid var(--borde-negro);
            padding: 8px;
            font-family: 'Lora', serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            color: black;
        }

        .btn-nav:hover {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        .logout-container { margin-top: auto; width: 85%; padding-bottom: 20px; }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            height: 110px;
            border-bottom: 2px solid var(--borde-negro);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background-color: var(--verde-paneles);
        }

        .social-center { text-align: center; flex: 1; }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 28px;
            margin-top: 5px;
        }

        .fa-whatsapp { color: #25D366; }
        .fa-instagram { color: #E1306C; }

        .logo-safime { height: 75px; }

        .qr-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1;
        }

        .fime-bg-logo {
            position: absolute;
            left: 50%;
            top: 55%;
            transform: translate(-50%, -50%);
            width: 500px;
            opacity: 0.1;
            z-index: 0;
            pointer-events: none;
        }

        .qr-panel {
            background-color: rgba(138, 155, 110, 0.95);
            border: 2px solid var(--borde-negro);
            width: 85%;
            max-width: 900px;
            height: 450px;
            padding: 30px;
            border-radius: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-title { font-size: 3rem; font-weight: bold; margin: 0 0 30px 0; }

        .qr-content-wrapper { display: flex; width: 100%; justify-content: space-around; align-items: center; }

        .qr-form { display: flex; flex-direction: column; gap: 20px; width: 45%; }

        .form-group { display: grid; grid-template-columns: 100px 1fr; align-items: center; gap: 15px; }

        .label-text { font-weight: bold; font-size: 1.1rem; }

        .select-capsule {
            background-color: var(--capsula-bg);
            border: 2px solid var(--borde-negro);
            border-radius: 20px;
            padding: 8px 15px;
            font-family: 'Lora', serif;
            outline: none;
            cursor: pointer;
            width: 100%;
        }

        .btn-create {
            background-color: #f3d4b1;
            border: 2px solid var(--borde-negro);
            border-radius: 25px;
            padding: 10px 40px;
            font-weight: bold;
            font-family: 'Lora', serif;
            cursor: pointer;
            transition: 0.3s;
            align-self: center;
            margin-top: 20px;
        }

        .btn-create:hover { box-shadow: 0 0 10px white; transform: scale(1.05); }

        .qr-viewer {
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--borde-negro);
            border-radius: 30px;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .qr-image { width: 85%; height: 85%; object-fit: contain; }

        .expand-icon {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }
        .expand-icon:hover { transform: scale(1.2); color: white; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            position: relative;
            text-align: center;
        }

        .modal-qr-img { width: 500px; height: 500px; }

        .close-modal {
            position: absolute;
            top: -15px;
            right: -15px;
            background: var(--cafe-botones);
            color: white;
            border: 2px solid black;
            border-radius: 50%;
            width: 35px; height: 35px;
            cursor: pointer;
            font-weight: bold;
        }

        .mini-logo-aso { position: absolute; bottom: 15px; right: 15px; width: 55px; border-radius: 50%; }

    </style>
</head>
<body>

    <aside class="sidebar">
        <img src="../Img/Logo de equipo.jpeg" alt="Logo SIGAE" class="logo-sigae">
        <nav class="nav-buttons">
            <a href="Inicio.html" class="btn-nav">Inicio</a>
            <a href="Miembros.html" class="btn-nav">Miembros</a>
            <a href="Administrador.html" class="btn-nav">Administradores</a>
            <a href="Crea_Event.html" class="btn-nav">Eventos</a>
            <a href="Crear_QR.html" class="btn-nav" style="box-shadow: 0 0 10px white;">QR</a>
            <a href="Lista_Asisten.html" class="btn-nav">Lista de asistencia</a>
            <a href="Voluntariado.html" class="btn-nav">Voluntariado</a>
        </nav>
        <div class="logout-container">
            <a href="../Login.html" class="btn-nav" style="display: block;">Cerrar sesión</a>
        </div>
    </aside>

    <div class="main-content">
        <header class="header">
            <div class="user-info">
                <strong>Nombre:</strong> Salazar Slytherin<br>
                <strong>Correo:</strong> Sa_sly95_12@gamil.com
            </div>

            <div class="social-center">
                <span style="font-weight: bold; font-size: 1.1rem;">Asociación Cadereyta</span>
                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>

            <div class="header-right">
                <img src="../Img/SAFIMEpng.png" alt="SAFIME" class="logo-safime">
                <i class="fa-solid fa-gear settings-icon"></i>
            </div>
        </header>

        <img src="../Img/fime-logo-cel.png" alt="FIME Background" class="fime-bg-logo">

        <main class="qr-container">
            <section class="qr-panel">
                <h1 class="qr-title">QR</h1>

                <div class="qr-content-wrapper">
                    <div class="qr-form">
                        <div class="form-group">
                            <span class="label-text">Eventos:</span>
                            <select id="select-event" class="select-capsule">
                                <option value="">Seleccionar evento...</option>
                                <option value="1">Evento 1</option>
                                <option value="2">Evento 2</option>
                                <option value="3">Evento 3</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <span class="label-text">Fecha:</span>
                            <select id="select-date" class="select-capsule">
                                <option value="">Seleccionar fecha...</option>
                                <option value="2026-04-21">21/04/2026</option>
                                <option value="2026-04-22">22/04/2026</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <span class="label-text">Duracion:</span>
                            <select id="select-duration" class="select-capsule">
                                <option value="10">10 min</option>
                                <option value="20">20 min</option>
                                <option value="30">30 min</option>
                                <option value="40">40 min</option>
                                <option value="50">50 min</option>
                                <option value="60">1 hora</option>
                            </select>
                        </div>

                        <button class="btn-create" onclick="generateQR()">Crear</button>
                    </div>

                    <div class="qr-viewer">
                        <i class="fa-solid fa-expand expand-icon" onclick="openModal()"></i>
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=SIGAE-EVENTO" alt="QR Code" class="qr-image" id="qr-img">
                    </div>
                </div>

                <img src="../Img/Logo de la Aso.jpeg" alt="Aso Logo" class="mini-logo-aso">
            </section>
        </main>
    </div>

    <div id="qrModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">X</button>
            <img id="modal-img" src="" class="modal-qr-img">
            <p style="margin-top: 10px; font-weight: bold;">Escanea para registrar asistencia</p>
        </div>
    </div>

    <script>
        function generateQR() {
            const event = document.getElementById('select-event').value;
            if(!event) return alert("Selecciona un evento primero");
            alert("QR generado correctamente para " + document.getElementById('select-event').options[document.getElementById('select-event').selectedIndex].text);
        }

        function openModal() {
            const modal = document.getElementById('qrModal');
            const qrSrc = document.getElementById('qr-img').src;
            document.getElementById('modal-img').src = qrSrc;
            modal.style.display = "flex";
        }

        function closeModal() {
            document.getElementById('qrModal').style.display = "none";
        }

        window.onclick = function(event) {
            const modal = document.getElementById('qrModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Asistencia - SIGAE</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --verde-fondo: #8b907c;
            --verde-paneles: #8a9b6e;
            --cafe-botones: #8b5e3c;
            --borde-negro: #1a1a1a;
            --capsula-bg: #adbca1;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Lora', serif;
            background-color: var(--verde-fondo);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 220px;
            border-right: 2px solid var(--borde-negro);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            background-color: var(--verde-paneles);
        }

        .logo-sigae { width: 100px; margin-bottom: 20px; border-radius: 50%; }

        .nav-buttons { display: flex; flex-direction: column; gap: 12px; width: 85%; }

        .btn-nav {
            background-color: var(--cafe-botones);
            border: 2px solid var(--borde-negro);
            padding: 8px;
            font-family: 'Lora', serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            color: black;
        }

        .btn-nav:hover {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        .logout-container { margin-top: auto; width: 85%; padding-bottom: 20px; }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            height: 110px;
            border-bottom: 2px solid var(--borde-negro);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background-color: var(--verde-paneles);
        }

        .social-center { text-align: center; flex: 1; }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 28px;
            margin-top: 5px;
        }

        .fa-whatsapp { color: #25D366; }
        .fa-instagram { color: #E1306C; }

        .logo-safime { height: 75px; }

        .attendance-container {
            flex: 1;
            padding: 20px 40px;
            z-index: 1;
            display: flex;
            flex-direction: column;
        }

        .fime-bg-logo {
            position: absolute;
            left: 50%;
            top: 55%;
            transform: translate(-50%, -50%);
            width: 500px;
            opacity: 0.1;
            z-index: 0;
            pointer-events: none;
        }

        .page-title {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .search-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .select-capsule {
            background-color: var(--capsula-bg);
            border: 2px solid var(--borde-negro);
            border-radius: 20px;
            padding: 8px 15px;
            font-family: 'Lora', serif;
            min-width: 150px;
            outline: none;
        }

        .btn-action {
            background-color: #f3d4b1;
            border: 2px solid var(--borde-negro);
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: bold;
            font-family: 'Lora', serif;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-action:hover { box-shadow: 0 0 10px white; }

        .content-grid {
            display: flex;
            gap: 30px;
            flex: 1;
        }

        .table-panel {
            flex: 1.5;
            background-color: rgba(138, 155, 110, 0.9);
            border: 2px solid var(--borde-negro);
            padding: 15px;
            border-radius: 5px;
            overflow-y: auto;
        }

        .table-header {
            background-color: rgba(0,0,0,0.1);
            text-align: center;
            font-weight: bold;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--borde-negro);
        }

        .attendance-row {
            display: grid;
            grid-template-columns: 45px 1fr 60px 45px;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .capsule {
            background-color: var(--capsula-bg);
            border: 2px solid var(--borde-negro);
            border-radius: 20px;
            padding: 8px;
            text-align: center;
        }

        .select-circle {
            width: 30px;
            height: 30px;
            border: 2px solid var(--borde-negro);
            border-radius: 50%;
            cursor: pointer;
            margin: auto;
        }

        .select-circle.active {
            background-color: var(--borde-negro);
            box-shadow: inset 0 0 0 4px var(--capsula-bg);
        }

        .detail-panel {
            flex: 0.8;
            background-color: rgba(138, 155, 110, 0.9);
            border: 2px solid var(--borde-negro);
            padding: 30px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: fit-content;
            margin-top: 50px;
        }

        .detail-info {
            font-size: 1.2rem;
            line-height: 2;
            margin-bottom: 30px;
        }

        .btn-delete-red {
            background-color: #ff0000;
            color: white;
            border: 2px solid var(--borde-negro);
            border-radius: 20px;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-delete-red:hover { box-shadow: 0 0 10px rgba(255,0,0,0.5); }

        .mini-logo-aso {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 55px;
            border-radius: 50%;
        }

    </style>
</head>
<body>

    <aside class="sidebar">
        <img src="../Img/Logo de equipo.jpeg" alt="Logo SIGAE" class="logo-sigae">
        <nav class="nav-buttons">
            <a href="Inicio.html" class="btn-nav">Inicio</a>
            <a href="Miembros.html" class="btn-nav">Miembros</a>
            <a href="Administradores.html" class="btn-nav">Administradores</a>
            <a href="Crea_Event.html" class="btn-nav">Eventos</a>
            <a href="Crear_QR.html" class="btn-nav">QR</a>
            <a href="Lista_Asisten.html" class="btn-nav" style="box-shadow: 0 0 10px white;">Lista de asistencia</a>
            <a href="Voluntariado.html" class="btn-nav">Voluntariado</a>
        </nav>
        <div class="logout-container">
            <a href="../Login.html" class="btn-nav" style="display: block;">Cerrar sesión</a>
        </div>
    </aside>

    <div class="main-content">
        <header class="header">
            <div class="user-info">
                <strong>Nombre:</strong> Salazar Slytherin<br>
                <strong>Correo:</strong> Sa_sly95_12@gamil.com
            </div>

            <div class="social-center">
                <span style="font-weight: bold; font-size: 1.1rem;">Asociación Cadereyta</span>
                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>

            <div class="header-right">
                <img src="../Img/SAFIMEpng.png" alt="SAFIME" class="logo-safime">
                <i class="fa-solid fa-gear settings-icon"></i>
            </div>
        </header>

        <img src="../Img/fime-logo-cel.png" alt="FIME Background" class="fime-bg-logo">

        <main class="attendance-container">
            <h1 class="page-title">Lista de asistencia</h1>

            <div class="search-bar">
                <label style="font-weight: bold;">Evento:</label>
                <select id="event-search" class="select-capsule">
                    <option value="1">Evento 1</option>
                    <option value="2">Evento 2</option>
                    <option value="3">Evento 3</option>
                    <option value="4" selected>Evento 4</option>
                </select>
                <button class="btn-action" onclick="loadList()">Mostar Lista</button>
                
                <button class="btn-action" style="margin-left: auto;">Guardar</button>
            </div>

            <div class="content-grid">
                <section class="table-panel">
                    <div class="table-header">Asistencia</div>
                    <div class="attendance-row" style="font-weight: bold; text-align: center; border-bottom: 1px solid black; margin-bottom: 15px;">
                        <span>ID</span><span>Nombre:</span><span>Puntos:</span><span></span>
                    </div>
                    <div id="attendance-list">
                        </div>
                </section>

                <section class="detail-panel">
                    <div id="detail-view" style="display: none;">
                        <div class="detail-info">
                            <strong>ID:</strong> <span id="det-id"></span><br>
                            <strong>Nombre:</strong> <span id="det-name"></span><br>
                            <strong>Puntos:</strong> <span id="det-pts"></span>
                        </div>
                        <button class="btn-delete-red" onclick="removeFromList()">Eliminar del registro</button>
                    </div>
                    <div id="no-selection" style="text-align: center; opacity: 0.6;">
                        <p>Selecciona un miembro de la lista para ver su información</p>
                    </div>
                </section>
            </div>

            <img src="../Img/Logo de la Aso.jpeg" alt="Aso Logo" class="mini-logo-aso">
        </main>
    </div>

    <script>
        let attendees = [
            { id: 1, name: "Salazar Slytherin", pts: 10 },
            { id: 2, name: "Pedro picapiedra", pts: 10 },
            { id: 3, name: "Daniel Gustavo", pts: 10 },
            { id: 4, name: "Malcom Wilkenson", pts: 10 },
            { id: 5, name: "Ricardo Homar", pts: 10 },
            { id: 6, name: "Hector Ricardo", pts: 10 }
        ];

        let selectedId = null;

        function loadList() {
            const list = document.getElementById('attendance-list');
            list.innerHTML = '';
            attendees.forEach(person => {
                const row = document.createElement('div');
                row.className = 'attendance-row';
                row.innerHTML = `
                    <div class="capsule" style="border-radius: 50%">${person.id}</div>
                    <div class="capsule">${person.name}</div>
                    <div class="capsule">${person.pts}</div>
                    <div class="select-circle ${selectedId === person.id ? 'active' : ''}" 
                         onclick="selectPerson(${person.id})"></div>
                `;
                list.appendChild(row);
            });
        }

        function selectPerson(id) {
            selectedId = id;
            const person = attendees.find(p => p.id === id);
            
            document.getElementById('no-selection').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            
            document.getElementById('det-id').innerText = person.id;
            document.getElementById('det-name').innerText = person.name;
            document.getElementById('det-pts').innerText = person.pts;
            
            loadList();
        }

        function removeFromList() {
            if(!selectedId) return;
            
            if(confirm("¿Seguro que deseas eliminar a este miembro del registro actual?")) {
                attendees = attendees.filter(p => p.id !== selectedId);
                selectedId = null;
                document.getElementById('detail-view').style.display = 'none';
                document.getElementById('no-selection').style.display = 'block';
                loadList();
            }
        }

        loadList();
    </script>
</body>
</html>

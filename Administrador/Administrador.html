<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Administradores - SIGAE</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --verde-fondo: #c8cdb8;
            --verde-panel: #8a9b6e;
            --cafe-btn: #8b5e3c;
            --negro-borde: #1a1a1a;
            --verde-cuadros-grandes: #5f6f4a;
            --verde-cuadritos-nombres: #8b907c;
            --gris-ph: #888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--verde-fondo);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* SIDEBAR — igual que Inicio */
        .sidebar {
            width: 220px;
            min-width: 220px;
            border-right: 2px solid var(--negro-borde);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 0;
            background-color: var(--verde-panel);
            z-index: 20;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .logo-sigae {
            width: 130px;
            height: 130px;
            margin-bottom: 16px;
            border-radius: 50%;
            border: 3px solid var(--negro-borde);
            object-fit: cover;
            background: #3a4a25;
            box-shadow: 0 4px 18px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }

        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 85%;
        }

        .btn-nav {
            background-color: var(--cafe-btn);
            border: 2px solid var(--negro-borde);
            padding: 10px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            text-decoration: none;
            color: #000;
            display: block;
            border-radius: 3px;
        }

        .btn-nav:hover,
        .btn-nav.active {
            box-shadow: 0 0 18px rgba(255,255,255,0.75);
            filter: brightness(1.2);
            transform: scale(1.04);
        }

        .logout-container {
            margin-top: auto;
            width: 85%;
            padding: 12px 0 18px;
        }

        /* MAIN */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
            position: relative;
        }

        /* HEADER — exactamente igual que Inicio */
        .header {
            height: 78px;
            border-bottom: 2px solid var(--negro-borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background-color: var(--verde-panel);
            z-index: 10;
            flex-shrink: 0;
            flex-wrap: nowrap;
            overflow: hidden;
            gap: 6px;
        }

        .user-info {
            font-size: 13px;
            line-height: 1.7;
            min-width: 150px;
        }

        .user-info strong {
            font-weight: 700;
        }

        .valor {
            color: var(--gris-ph);
            font-style: italic;
        }

        .valor.activo {
            color: inherit;
            font-style: normal;
        }

        .social-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .asociacion-titulo {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
        }

        .social-icons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .social-icons a {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .social-icons a:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
        }

        .social-icons a svg {
            width: 36px;
            height: 36px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        /* Logo SAFIME — cambia solo height para ajustar tamaño */
        .logo-safime {
            height: 220px;
            width: auto;
            max-width: 160px;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
        }

        .settings-icon {
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.35s;
            flex-shrink: 0;
            line-height: 1;
        }

        .settings-icon:hover {
            transform: rotate(65deg);
        }

        /* FONDO FIME */
        .fime-bg-logo {
            position: absolute;
            left: 50%;
            top: 55%;
            transform: translate(-50%, -50%);
            width: 700px;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }

        /* CONTENIDO */
        .members-container {
            flex: 1;
            display: flex;
            padding: 30px;
            gap: 30px;
            z-index: 1;
            justify-content: center;
            align-items: flex-start;
        }

        .panel {
            background-color: var(--verde-cuadros-grandes);
            border: 2px solid var(--negro-borde);
            padding: 20px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
        }

        .left-panel  { width: 550px; height: 480px; }
        .right-panel { width: 400px; height: 480px; justify-content: space-between; }

        .scroll-list {
            overflow-y: auto;
            padding-right: 10px;
            flex: 1;
            max-height: 350px;
        }

        .scroll-list::-webkit-scrollbar { width: 8px; }
        .scroll-list::-webkit-scrollbar-thumb {
            background: var(--cafe-btn);
            border-radius: 10px;
            border: 1px solid black;
        }

        .capsule {
            background-color: var(--verde-cuadritos-nombres);
            border: 2px solid var(--negro-borde);
            border-radius: 25px;
            padding: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
        }

        .id-circle {
            width: 40px;
            height: 40px;
            border: 2px solid black;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background-color: var(--verde-cuadritos-nombres);
        }

        .member-row {
            display: grid;
            grid-template-columns: 50px 1fr 50px;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .table-header {
            display: grid;
            grid-template-columns: 50px 1fr 50px;
            gap: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .radio-btn {
            width: 25px;
            height: 25px;
            cursor: pointer;
            accent-color: var(--negro-borde);
        }

        .input-group { display: flex; flex-direction: column; gap: 10px; }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .label-text {
            color: black;
            font-weight: bold;
            width: 100px;
            text-align: right;
            font-family: 'Lora', serif;
        }

        .input-capsule {
            flex: 1;
            border: 2px solid black;
            border-radius: 25px;
            padding: 8px;
            text-align: center;
            font-family: 'Lora', serif;
            font-weight: bold;
            outline: none;
            background: white;
        }

        .btn-crear {
            background-color: #f3d4b1;
            padding: 8px 30px;
            border-radius: 20px;
            border: 2px solid black;
            font-weight: bold;
            cursor: pointer;
            align-self: center;
            margin-top: 10px;
            font-family: 'Nunito', sans-serif;
        }

        .delete-section {
            border-top: 2px solid black;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .btn-delete {
            background-color: #ff4d4d;
            color: white;
            padding: 10px 25px;
            border-radius: 20px;
            border: 2px solid black;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
        }

        .mini-logo-aso {
            width: 70px;
            border-radius: 50%;
            border: 1px solid black;
            align-self: flex-end;
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <img src="../Img/Logo de equipo.jpeg" alt="Logo SIGAE" class="logo-sigae">
        <nav class="nav-buttons">
            <a href="Inicio.html" class="btn-nav">Inicio</a>
            <a href="Miembros.html" class="btn-nav">Miembros</a>
            <a href="Administrador.html" class="btn-nav active">Administradores</a>
            <a href="Crea_Event.html" class="btn-nav">Eventos</a>
            <a href="Crear_QR.html" class="btn-nav">QR</a>
            <a href="Lista_Asisten.html" class="btn-nav">Lista de asistencia</a>
            <a href="Voluntariado.html" class="btn-nav">Voluntariado</a>
        </nav>
        <div class="logout-container">
            <a href="../Login.html" class="btn-nav" style="display:block;">Cerrar sesión</a>
        </div>
    </aside>

    <div class="main-content">

        <!-- HEADER idéntico al de Inicio.html -->
        <header class="header">
            <div class="user-info">
                <strong>Nombre:</strong> <span id="user-nombre" class="valor">Usuario</span><br>
                <strong>Correo:</strong> <span id="user-correo" class="valor">correo@ejemplo.com</span>
            </div>

            <div class="social-center">
                <span class="asociacion-titulo">Asociación Cadereyta</span>
                <div class="social-icons">
                    <a href="#" target="_blank" title="WhatsApp" style="background:#25D366; border-radius:10px;">
                        <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>

                        </svg>
                    </a>
                    <a href="#" target="_blank" title="Instagram"
                        style="background:linear-gradient(135deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%); border-radius:10px;">
                        <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">

                        </svg>
                    </a>
                </div>
            </div>

            <div class="header-right">
                <img src="../Img/SAFIMEpng.png" alt="SAFIME" class="logo-safime">
                <i class="fa-solid fa-gear settings-icon" title="Configuración"></i>
            </div>
        </header>

        <img src="../Img/fime-logo-cel.png" alt="FIME Background" class="fime-bg-logo">

        <main class="members-container">
            <section class="panel left-panel">
                <h3 style="text-align:center; margin-top:0; color:white; font-size:24px; font-family:'Playfair Display',serif;">Administradores</h3>
                <div class="table-header">
                    <div class="id-circle" style="background:#adbca1;">ID</div>
                    <div class="capsule" style="background:#adbca1;">Nombre:</div>
                    <div></div>
                </div>
                <div id="admin-list" class="scroll-list"></div>
            </section>

            <section class="panel right-panel">
                <div class="input-group">
                    <div class="input-row">
                        <span class="label-text">Administrador:</span>
                        <input type="text" id="new-name" class="input-capsule">
                    </div>
                    <div class="input-row">
                        <span class="label-text">Correo:</span>
                        <input type="email" id="new-email" class="input-capsule">
                    </div>
                    <div class="input-row">
                        <span class="label-text">Contraseña:</span>
                        <input type="password" id="new-pass" class="input-capsule" placeholder="••••••••">
                    </div>
                    <button class="btn-crear" onclick="createAdmin()">Crear</button>
                </div>

                <div class="delete-section">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-weight:bold; color:white;">ID:</span>
                        <div class="id-circle" id="selected-id-display">-</div>
                    </div>
                    <button class="btn-delete" onclick="confirmDelete()">Eliminar Cuenta</button>
                </div>

                <img src="../Img/Logo de la Aso.jpeg" alt="Aso Logo" class="mini-logo-aso">
            </section>
        </main>
    </div>

    <script>
        /* DATOS DE SESION */
        function setUsuario(nombre, correo) {
            const elN = document.getElementById('user-nombre');
            const elC = document.getElementById('user-correo');
            if (nombre) { elN.textContent = nombre; elN.classList.add('activo'); }
            if (correo) { elC.textContent = correo; elC.classList.add('activo'); }
        }
        setUsuario(
            sessionStorage.getItem('nombre'),
            sessionStorage.getItem('correo')
        );

        let adminData = [
            { id: 1, name: "Roberto Juarez",  email: "Sa_sly95_12@gmail.com" },
            { id: 2, name: "Espinosa Uriel",  email: "uri@gmail.com" },
            { id: 3, name: "Daniel Gustavo",  email: "dan@gmail.com" },
            { id: 5, name: "Ricardo Homar",   email: "ric@gmail.com" },
            { id: 6, name: "Hector Ricardo",  email: "hec@gmail.com" }
        ];

        let selectedAdminId = null;

        function renderAdmins() {
            const list = document.getElementById('admin-list');
            list.innerHTML = '';
            adminData.forEach(admin => {
                const row = document.createElement('div');
                row.className = 'member-row';
                row.innerHTML = `
                    <div class="id-circle">${admin.id}</div>
                    <div class="capsule">${admin.name}</div>
                    <input type="radio" name="adminSelect" class="radio-btn" onclick="selectAdmin(${admin.id})">
                `;
                list.appendChild(row);
            });
        }

        function selectAdmin(id) {
            selectedAdminId = id;
            document.getElementById('selected-id-display').innerText = id;
        }

        function createAdmin() {
            const name  = document.getElementById('new-name').value;
            const email = document.getElementById('new-email').value;
            if (!name || !email) return alert("Llena los campos básicos");
            const newId = adminData.length > 0 ? Math.max(...adminData.map(a => a.id)) + 1 : 1;
            adminData.push({ id: newId, name, email });
            document.getElementById('new-name').value  = '';
            document.getElementById('new-email').value = '';
            document.getElementById('new-pass').value  = '';
            renderAdmins();
            alert("Administrador creado");
        }

        function confirmDelete() {
            if (!selectedAdminId) return alert("Por favor, selecciona un administrador usando el botón al lado de su nombre.");
            const pass = prompt("Para eliminar esta cuenta, por favor ingresa tu contraseña de administrador:");
            if (pass !== null) {
                if (pass.length >= 4) {
                    adminData = adminData.filter(a => a.id !== selectedAdminId);
                    selectedAdminId = null;
                    document.getElementById('selected-id-display').innerText = "-";
                    renderAdmins();
                    alert("Cuenta eliminada correctamente.");
                } else {
                    alert("Contraseña incorrecta.");
                }
            }
        }

        renderAdmins();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miembros - SIGAE</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --verde-fondo: #8b907c;
            --verde-paneles: #8a9b6e;
            --cafe-botones: #8b5e3c;
            --borde-negro: #1a1a1a;
            --verde-cuadros-grandes: #5f6f4a;
            --verde-cuadritos-nombres: #8b907c;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Lora', serif;
            background-color: var(--verde-fondo);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 220px;
            border-right: 2px solid var(--borde-negro);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            background-color: var(--verde-paneles);
            z-index: 10;
        }

        .logo-sigae {
            width: 100px;
            margin-bottom: 20px;
            border-radius: 50%;
            border: 2px solid var(--borde-negro);
        }

        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 85%;
        }

        .btn-nav {
            background-color: var(--cafe-botones);
            border: 2px solid var(--borde-negro);
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            color: black;
            transition: 0.3s;
        }

        .btn-nav:hover {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            transform: scale(1.05);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            height: 100px;
            border-bottom: 2px solid var(--borde-negro);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            background-color: var(--verde-paneles);
            z-index: 10;
        }

        .social-icons {
            display: flex;
            gap: 20px;
            font-size: 32px;
        }

        .social-icons a {
            background-color: white;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--borde-negro);
            color: inherit;
            text-decoration: none;
        }

        .fa-whatsapp {
            color: #25D366;
        }

        .fa-instagram {
            color: #E1306C;
        }

        .logo-safime {
            height: 220px;
            width: auto;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .fime-bg-logo {
            position: absolute;
            left: 50%;
            top: 55%;
            transform: translate(-50%, -50%);
            width: 700px;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }

        /* --- AJUSTES DE PANELES --- */
        .members-container {
            flex: 1;
            display: flex;
            padding: 30px;
            gap: 30px;
            z-index: 1;
            justify-content: center;
            align-items: flex-start;
        }

        .panel {
            background-color: var(--verde-cuadros-grandes);
            border: 2px solid var(--borde-negro);
            padding: 20px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.2);
        }

        .left-panel {
            width: 550px;
            height: 480px;
        }

        .right-panel {
            width: 400px;
            height: 480px;
            justify-content: space-between;
        }

        /* --- MODIFICADO: SCROLL AUTOMÁTICO --- */
        .scroll-list {
            overflow-y: auto;
            padding-right: 10px;
            flex: 1;
            /* Esto hace que ocupe el espacio sobrante y active el scroll */
            max-height: 350px;
            /* Limita la altura para que no empuje el panel */
        }

        .scroll-list::-webkit-scrollbar {
            width: 8px;
        }

        .scroll-list::-webkit-scrollbar-thumb {
            background: var(--cafe-botones);
            border-radius: 10px;
            border: 1px solid black;
        }

        .scroll-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        .capsule {
            background-color: var(--verde-cuadritos-nombres);
            border: 2px solid var(--borde-negro);
            border-radius: 25px;
            padding: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            /* Asegura que ocupen el grid */
            box-sizing: border-box;
        }

        .member-row {
            display: grid;
            grid-template-columns: 50px 1fr 100px;
            gap: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .member-row:hover {
            filter: brightness(1.2);
            transform: scale(1.01);
        }

        .table-header {
            display: grid;
            grid-template-columns: 50px 1fr 100px 40px;
            gap: 10px;
            margin-bottom: 15px;
        }

        .header-capsule {
            background-color: #adbca1;
            color: #1a1a1a;
        }

        /* --- BOTONES DE ACCIÓN --- */
        .action-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .btn-action {
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid var(--borde-negro);
            font-family: 'Lora';
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-edit {
            background-color: #f3d4b1;
        }

        .btn-save {
            background-color: #f3d4b1;
            display: none;
        }

        .btn-delete {
            background-color: #ff4d4d;
            color: white;
        }

        .mini-logo-aso {
            width: 70px;
            border-radius: 50%;
            border: 1px solid black;
            align-self: flex-end;
        }

        /* MODIFICADO: Estilo para los inputs del panel derecho para que se vean como cápsulas */
        .input-capsule {
            border: 2px solid black;
            border-radius: 25px;
            padding: 8px;
            text-align: center;
            font-family: 'Lora';
            font-weight: bold;
            outline: none;
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <img src="../Img/Logo de equipo.jpeg" alt="Logo SIGAE" class="logo-sigae">
        <nav class="nav-buttons">
            <a href="Inicio.html" class="btn-nav">Inicio</a>
            <a href="Miembros.html" class="btn-nav" style="box-shadow: 0 0 10px white;">Miembros</a>
            <a href="Administrador.html" class="btn-nav">Administradores</a>
            <a href="Crea_Event.html" class="btn-nav">Eventos</a>
            <a href="Crear_QR.html" class="btn-nav">QR</a>
            <a href="Lista_Asisten.html" class="btn-nav">Lista de asistencia</a>
            <a href="Voluntariado.html" class="btn-nav">Voluntariado</a>
        </nav>
        <div class="logout-container" style="margin-top: auto; width: 85%; padding-bottom: 20px;">
            <a href="../Login.html" class="btn-nav" style="display: block;">Cerrar sesión</a>
        </div>
    </aside>

    <div class="main-content">
        <header class="header">
            <div class="user-info"><strong>Nombre:</strong> Roberto Juarez<br><strong>Correo:</strong>
                Sa_sly95_12@gamil.com</div>
            <div class="social-center" style="text-align: center;">
                <span style="font-weight: bold; font-size: 25px;">Asociación Cadereyta</span>
                <div class="social-icons" style="justify-content: center;">
                    <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>
            <div class="header-right">
                <img src="../Img/SAFIMEpng.png" alt="SAFIME" class="logo-safime">
                <i class="fa-solid fa-gear" style="font-size: 28px;"></i>
            </div>
        </header>

        <img src="../Img/fime-logo-cel.png" alt="FIME Background" class="fime-bg-logo">

        <main class="members-container">
            <section class="panel left-panel">
                <h3 style="text-align: center; margin-top: 0; color: white; font-size: 24px;">Miembros</h3>

                <div class="table-header">
                    <div class="capsule header-capsule">ID</div>
                    <div class="capsule header-capsule">Nombre:</div>
                    <div class="capsule header-capsule">Puntos:</div>
                    <i class="fa-solid fa-filter" style="cursor:pointer; color: white; align-self: center;"
                        onclick="toggleSort()" title="Ordenar por puntos"></i>
                </div>

                <div id="members-list" class="scroll-list">
                </div>
            </section>

            <section class="panel right-panel">
                <div
                    style="background: white; border-radius: 25px; display: flex; align-items: center; padding: 5px 15px; border: 2px solid black;">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Buscar ID o Nombre..." onkeyup="filterMembers()"
                        style="border: none; outline: none; width: 100%; margin-left: 10px; font-family: 'Lora';">
                </div>

                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <div
                        style="display: grid; grid-template-columns: 50px 1fr 80px; gap: 10px; font-weight: bold; text-align: center; color: white;">
                        <span>ID</span><span>Nombre:</span><span>Puntos:</span>
                    </div>
                    <div style="display: grid; grid-template-columns: 50px 1fr 80px; gap: 10px;">
                        <div class="capsule" id="edit-id" style="background-color: white;">-</div>
                        <input type="text" class="input-capsule" id="edit-name" style="background-color: white;"
                            disabled>
                        <input type="number" class="input-capsule" id="edit-points" style="background-color: white;"
                            disabled>
                    </div>
                </div>

                <div class="action-btns">
                    <button class="btn-action btn-edit" id="btn-edit" onclick="enableEdit()">Editar</button>
                    <button class="btn-action btn-save" id="btn-save" onclick="saveChanges()">Guardar</button>
                    <button class="btn-action btn-delete" onclick="deleteAccount()">Eliminar Cuenta</button>
                </div>

                <img src="../Img/Logo de la Aso.jpeg" alt="Aso Logo" class="mini-logo-aso">
            </section>
        </main>
    </div>

    <script>
        // Datos iniciales
        let membersData = [
            { id: 1, name: "Salazar Slytherin", points: 300 },
            { id: 2, name: "Pedro picapiedra", points: 256 },
            { id: 3, name: "Daniel Gustavo", points: 250 },
            { id: 4, name: "Malcom Wilkenson", points: 220 },
            { id: 5, name: "Ricardo Homar", points: 171 },
            { id: 6, name: "Hector Ricardo", points: 85 }
        ];

        let selectedId = null;
        let sortAscending = false;

        // --- FUNCIÓN: RENDERIZAR LISTA (ACTUALIZADA) ---
        function renderList(data) {
            const listContainer = document.getElementById('members-list');
            listContainer.innerHTML = '';
            data.forEach(m => {
                const row = document.createElement('div');
                row.className = 'member-row';
                // Al hacer clic, se manda la información al cuadro derecho
                row.onclick = () => selectMember(m);
                row.innerHTML = `
                    <div class="capsule">${m.id}</div>
                    <div class="capsule">${m.name}</div>
                    <div class="capsule">${m.points}</div>
                `;
                listContainer.appendChild(row);
            });
        }

        // --- FUNCIÓN: SELECCIONAR MIEMBRO ---
        function selectMember(member) {
            selectedId = member.id;
            document.getElementById('edit-id').innerText = member.id;
            document.getElementById('edit-name').value = member.name;
            document.getElementById('edit-points').value = member.points;
            disableInputs(); // Siempre inicia bloqueado al seleccionar uno nuevo
        }

        // --- FUNCIÓN: HABILITAR EDICIÓN ---
        function enableEdit() {
            if (!selectedId) return alert("Primero selecciona un miembro de la lista");
            document.getElementById('edit-name').disabled = false;
            document.getElementById('edit-points').disabled = false;
            document.getElementById('btn-edit').style.display = 'none';
            document.getElementById('btn-save').style.display = 'inline-block';
            document.getElementById('edit-name').focus();
        }

        // --- FUNCIÓN: GUARDAR CAMBIOS ---
        function saveChanges() {
            const index = membersData.findIndex(m => m.id === selectedId);
            if (index !== -1) {
                membersData[index].name = document.getElementById('edit-name').value;
                membersData[index].points = parseInt(document.getElementById('edit-points').value);

                renderList(membersData); // Refresca la lista de la izquierda
                disableInputs(); // Bloquea de nuevo
                alert("Cambios guardados con éxito");
            }
        }

        // --- FUNCIÓN: ELIMINAR ---
        function deleteAccount() {
            if (!selectedId) return alert("Selecciona un miembro para eliminar");
            if (confirm("¿Estás seguro de que deseas eliminar a este miembro?")) {
                membersData = membersData.filter(m => m.id !== selectedId);
                selectedId = null;
                // Limpiar cuadro derecho
                document.getElementById('edit-id').innerText = "-";
                document.getElementById('edit-name').value = "";
                document.getElementById('edit-points').value = "";
                renderList(membersData);
            }
        }

        // --- FUNCIÓN: FILTRO/ORDEN POR PUNTOS ---
        function toggleSort() {
            sortAscending = !sortAscending;
            // Ordena de mayor a menor o viceversa
            membersData.sort((a, b) => sortAscending ? a.points - b.points : b.points - a.points);
            renderList(membersData);
        }

        // --- FUNCIÓN: BUSCADOR ---
        function filterMembers() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const filtered = membersData.filter(m =>
                m.name.toLowerCase().includes(val) ||
                m.id.toString().includes(val)
            );
            renderList(filtered);
        }

        function disableInputs() {
            document.getElementById('edit-name').disabled = true;
            document.getElementById('edit-points').disabled = true;
            document.getElementById('btn-edit').style.display = 'inline-block';
            document.getElementById('btn-save').style.display = 'none';
        }

        // Carga inicial
        renderList(membersData);
    </script>
</body>

</html>

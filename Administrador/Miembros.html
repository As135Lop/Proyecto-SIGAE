<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Miembros - SIGAE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --verde-fondo: #c8cdb8;
            --verde-panel: #8a9b6e;
            --cafe-btn: #8b5e3c;
            --negro-borde: #1a1a1a;
            --fondo-box: rgba(139, 144, 124, 0.92);
            --cafe-edit: #5d4037;
            --gris-ph: #888;
            --verde-cuadros-grandes: #5f6f4a;
            --verde-cuadritos-nombres: #8b907c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--verde-fondo);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 220px;
            min-width: 220px;
            border-right: 2px solid var(--negro-borde);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 0;
            background-color: var(--verde-panel);
            z-index: 20;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .logo-sigae {
            width: 130px;
            height: 130px;
            margin-bottom: 16px;
            border-radius: 50%;
            border: 3px solid var(--negro-borde);
            object-fit: cover;
            background: #3a4a25;
            box-shadow: 0 4px 18px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }

        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 85%;
        }

        .btn-nav {
            background-color: var(--cafe-btn);
            border: 2px solid var(--negro-borde);
            padding: 10px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            text-decoration: none;
            color: #000;
            display: block;
            border-radius: 3px;
        }

        .btn-nav:hover,
        .btn-nav.active {
            box-shadow: 0 0 18px rgba(255,255,255,0.75);
            filter: brightness(1.2);
            transform: scale(1.04);
        }

        .logout-container {
            margin-top: auto;
            width: 85%;
            padding: 12px 0 18px;
        }

        /* ── MAIN ── */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        /* ── HEADER ── */
        .header {
            height: 78px;
            border-bottom: 2px solid var(--negro-borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background-color: var(--verde-panel);
            z-index: 10;
            flex-shrink: 0;
            flex-wrap: nowrap;
            overflow: hidden;
            gap: 6px;
        }

        .user-info {
            font-size: 13px;
            line-height: 1.7;
            min-width: 150px;
        }

        .user-info strong {
            font-weight: 700;
        }

        .valor {
            color: var(--gris-ph);
            font-style: italic;
        }

        .valor.activo {
            color: inherit;
            font-style: normal;
        }

        .social-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .asociacion-titulo {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
        }

        .social-icons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .social-icons a {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .social-icons a:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
        }

        .social-icons a svg {
            width: 36px;
            height: 36px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .logo-safime {
            height: 200px;
            width: auto;
            max-width: 160px;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
        }

        .settings-icon {
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.35s;
            flex-shrink: 0;
            line-height: 1;
        }

        .settings-icon:hover {
            transform: rotate(65deg);
        }

        /* ── ÁREA PRINCIPAL ── */
        .page-area {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .fime-bg-logo {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 570px;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }

        /* ── PANELES ── */
        .members-container {
            flex: 1;
            display: flex;
            padding: 30px;
            gap: 30px;
            z-index: 1;
            justify-content: center;
            align-items: flex-start;
        }

        .panel {
            background-color: var(--verde-cuadros-grandes);
            border: 2px solid var(--negro-borde);
            padding: 20px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
        }

        .left-panel {
            width: 550px;
            height: 480px;
        }

        .right-panel {
            width: 400px;
            height: 480px;
            justify-content: space-between;
        }

        .panel h3 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            margin-top: 0;
            color: white;
            font-size: 24px;
            margin-bottom: 14px;
        }

        .scroll-list {
            overflow-y: auto;
            padding-right: 10px;
            flex: 1;
            max-height: 350px;
        }

        .scroll-list::-webkit-scrollbar { width: 8px; }
        .scroll-list::-webkit-scrollbar-thumb {
            background: var(--cafe-btn);
            border-radius: 10px;
            border: 1px solid black;
        }
        .scroll-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }

        .capsule {
            background-color: var(--verde-cuadritos-nombres);
            border: 2px solid var(--negro-borde);
            border-radius: 25px;
            padding: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
        }

        .member-row {
            display: grid;
            grid-template-columns: 50px 1fr 100px;
            gap: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .member-row:hover {
            filter: brightness(1.2);
            transform: scale(1.01);
        }

        .table-header {
            display: grid;
            grid-template-columns: 50px 1fr 100px 40px;
            gap: 10px;
            margin-bottom: 15px;
        }

        .header-capsule {
            background-color: #adbca1;
            color: #1a1a1a;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .btn-action {
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid var(--negro-borde);
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-action:hover {
            filter: brightness(1.1);
            transform: scale(1.04);
        }

        .btn-editar { background-color: #f3d4b1; }
        .btn-guardar { background-color: #f3d4b1; display: none; }
        .btn-delete { background-color: #ff4d4d; color: white; }

        .mini-logo-aso {
            width: 70px;
            border-radius: 50%;
            border: 1px solid black;
            align-self: flex-end;
        }

        .input-capsule {
            border: 2px solid black;
            border-radius: 25px;
            padding: 8px;
            text-align: center;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            outline: none;
        }

        /* ── RESPONSIVO MÓVIL ── */
        @media (max-width: 700px) {
            body {
                flex-direction: column;
                overflow-y: auto;
            }

            .sidebar {
                width: 100%;
                min-width: unset;
                flex-direction: row;
                flex-wrap: nowrap;
                overflow: hidden;
                justify-content: center;
                padding: 10px;
                border-right: none;
                border-bottom: 2px solid var(--negro-borde);
                overflow-y: visible;
            }

            .logo-sigae {
                width: 70px;
                height: 70px;
                margin: 0 10px 0 0;
            }

            .nav-buttons {
                flex-direction: row;
                flex-wrap: nowrap;
                overflow: hidden;
                justify-content: center;
                gap: 6px;
                width: auto;
            }

            .btn-nav {
                font-size: 12px;
                padding: 7px 10px;
            }

            .logout-container {
                width: auto;
                padding: 0;
            }

            .main-content {
                overflow: visible;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                padding: 10px 12px;
                height: auto;
            }

            .page-area {
                overflow: visible;
            }

            .members-container {
                flex-direction: column;
                align-items: center;
                padding: 14px 10px;
            }

            .left-panel,
            .right-panel {
                width: 98%;
                height: auto;
            }

            .fime-bg-logo {
                width: 280px;
            }
        }
    </style>
</head>

<body>

    <!-- ══ SIDEBAR ══ -->
    <aside class="sidebar">
        <img src="../Img/Logo de equipo.jpeg" alt="Logo SIGAE" class="logo-sigae">
        <nav class="nav-buttons">
            <a href="Inicio.html" class="btn-nav">Inicio</a>
            <a href="Miembros.html" class="btn-nav active">Miembros</a>
            <a href="Administrador.html" class="btn-nav">Administradores</a>

    <!-- ══ MAIN ══ -->
    <div class="main-content">

        <!-- HEADER -->
        <header class="header">
            <div class="user-info">
                <strong>Nombre:</strong> <span id="user-nombre" class="valor">Usuario</span><br>
                <strong>Correo:</strong> <span id="user-correo" class="valor">correo@ejemplo.com</span>
            </div>

            <div class="social-center">
                <span class="asociacion-titulo">Asociación Cadereyta</span>
                <div class="social-icons">

                    </a>
                </div>
            </div>

            <div class="header-right">
                <img src="../Img/SAFIMEpng.png" alt="SAFIME" class="logo-safime">
                <i class="fa-solid fa-gear settings-icon" title="Configuración" onclick="irAConfig()"></i>
            </div>
        </header>

        <!-- ÁREA PRINCIPAL -->
        <div class="page-area">
            <img src="../Img/fime-logo-cel.png" alt="FIME fondo" class="fime-bg-logo">

            <main class="members-container">

                <!-- Panel izquierdo: lista -->
                <section class="panel left-panel">
                    <h3>Miembros</h3>

                    <div class="table-header">
                        <div class="capsule header-capsule">ID</div>
                        <div class="capsule header-capsule">Nombre:</div>
                        <div class="capsule header-capsule">Puntos:</div>
                        <i class="fa-solid fa-filter" style="cursor:pointer; color:white; align-self:center;"
                            onclick="toggleSort()" title="Ordenar por puntos"></i>
                    </div>

                    <div id="members-list" class="scroll-list"></div>
                </section>

                <!-- Panel derecho: detalle/edición -->
                <section class="panel right-panel">
                    <div style="background:white; border-radius:25px; display:flex; align-items:center; padding:5px 15px; border:2px solid black;">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Buscar ID o Nombre..."
                            onkeyup="filterMembers()"
                            style="border:none; outline:none; width:100%; margin-left:10px; font-family:'Nunito',sans-serif;">
                    </div>

                    <div style="display:flex; flex-direction:column; gap:15px;">
                        <div style="display:grid; grid-template-columns:50px 1fr 80px; gap:10px; font-weight:bold; text-align:center; color:white; font-family:'Playfair Display',serif;">
                            <span>ID</span><span>Nombre:</span><span>Puntos:</span>
                        </div>
                        <div style="display:grid; grid-template-columns:50px 1fr 80px; gap:10px;">
                            <div class="capsule" id="edit-id" style="background-color:white;">-</div>
                            <input type="text"   class="input-capsule" id="edit-name"   style="background-color:white;" disabled>
                            <input type="number" class="input-capsule" id="edit-points" style="background-color:white;" disabled>
                        </div>
                    </div>

                    <div class="action-btns">
                        <button class="btn-action btn-editar"  id="btn-edit"  onclick="enableEdit()">Editar</button>
                        <button class="btn-action btn-guardar" id="btn-save"  onclick="saveChanges()">Guardar</button>
                        <button class="btn-action btn-delete"  onclick="deleteAccount()">Eliminar Cuenta</button>
                    </div>

                    <img src="../Img/Logo de la Aso.jpeg" alt="Aso Logo" class="mini-logo-aso">
                </section>

            </main>
        </div>
    </div>

    <script>
        /* ── SESIÓN ── */
        function setUsuario(nombre, correo) {
            const elN = document.getElementById('user-nombre');
            const elC = document.getElementById('user-correo');
            if (nombre) { elN.textContent = nombre; elN.classList.add('activo'); }
            if (correo) { elC.textContent = correo; elC.classList.add('activo'); }
        }
        setUsuario(
            sessionStorage.getItem('nombre'),
            sessionStorage.getItem('correo')
        );

        function irAConfig() {
            sessionStorage.setItem('paginaAnterior', window.location.href);
            window.location.href = '../Configuracion.html';
        }

        /* ── DATOS ── */
        let membersData = [
            { id: 1, name: "Salazar Slytherin",  points: 300 },
            { id: 2, name: "Pedro Picapiedra",   points: 256 },
            { id: 3, name: "Daniel Gustavo",      points: 250 },
            { id: 4, name: "Malcom Wilkenson",    points: 220 },
            { id: 5, name: "Ricardo Homar",       points: 171 },
            { id: 6, name: "Hector Ricardo",      points: 85  }
        ];

        let selectedId    = null;
        let sortAscending = false;

        function renderList(data) {
            const listContainer = document.getElementById('members-list');
            listContainer.innerHTML = '';
            data.forEach(m => {
                const row = document.createElement('div');
                row.className = 'member-row';
                row.onclick = () => selectMember(m);
                row.innerHTML = `
                    <div class="capsule">${m.id}</div>
                    <div class="capsule">${m.name}</div>
                    <div class="capsule">${m.points}</div>
                `;
                listContainer.appendChild(row);
            });
        }

        function selectMember(member) {
            selectedId = member.id;
            document.getElementById('edit-id').innerText     = member.id;
            document.getElementById('edit-name').value       = member.name;
            document.getElementById('edit-points').value     = member.points;
            disableInputs();
        }

        function enableEdit() {
            if (!selectedId) return alert("Primero selecciona un miembro de la lista");
            document.getElementById('edit-name').disabled   = false;
            document.getElementById('edit-points').disabled = false;
            document.getElementById('btn-edit').style.display = 'none';
            document.getElementById('btn-save').style.display = 'inline-block';
            document.getElementById('edit-name').focus();
        }

        function saveChanges() {
            const index = membersData.findIndex(m => m.id === selectedId);
            if (index !== -1) {
                membersData[index].name   = document.getElementById('edit-name').value;
                membersData[index].points = parseInt(document.getElementById('edit-points').value);
                renderList(membersData);
                disableInputs();
                alert("Cambios guardados con éxito");
            }
        }

        function deleteAccount() {
            if (!selectedId) return alert("Selecciona un miembro para eliminar");
            if (confirm("¿Estás seguro de que deseas eliminar a este miembro?")) {
                membersData = membersData.filter(m => m.id !== selectedId);
                selectedId  = null;
                document.getElementById('edit-id').innerText   = "-";
                document.getElementById('edit-name').value     = "";
                document.getElementById('edit-points').value   = "";
                renderList(membersData);
            }
        }

        function toggleSort() {
            sortAscending = !sortAscending;
            membersData.sort((a, b) => sortAscending ? a.points - b.points : b.points - a.points);
            renderList(membersData);
        }

        function filterMembers() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const filtered = membersData.filter(m =>
                m.name.toLowerCase().includes(val) ||
                m.id.toString().includes(val)
            );
            renderList(filtered);
        }

        function disableInputs() {
            document.getElementById('edit-name').disabled   = true;
            document.getElementById('edit-points').disabled = true;
            document.getElementById('btn-edit').style.display = 'inline-block';
            document.getElementById('btn-save').style.display = 'none';
        }

        renderList(membersData);
    </script>
</body>

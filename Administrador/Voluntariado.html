<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Voluntariado - SIGAE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --verde-fondo: #c8cdb8;
            --verde-panel: #8a9b6e;
            --cafe-btn: #8b5e3c;
            --negro-borde: #1a1a1a;
            --gris-ph: #888;
            --capsula-bg: #adbca1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--verde-fondo);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 220px;
            min-width: 220px;
            border-right: 2px solid var(--negro-borde);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 0;
            background-color: var(--verde-panel);
            z-index: 20;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .logo-sigae {
            width: 130px;
            height: 130px;
            margin-bottom: 16px;
            border-radius: 50%;
            border: 3px solid var(--negro-borde);
            object-fit: cover;
            background: #3a4a25;
            box-shadow: 0 4px 18px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }

        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 85%;
        }

        .btn-nav {
            background-color: var(--cafe-btn);
            border: 2px solid var(--negro-borde);
            padding: 10px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            text-decoration: none;
            color: #000;
            display: block;
            border-radius: 3px;
        }

        .btn-nav:hover,
        .btn-nav.active {
            box-shadow: 0 0 18px rgba(255,255,255,0.75);
            filter: brightness(1.2);
            transform: scale(1.04);
        }

        .logout-container {
            margin-top: auto;
            width: 85%;
            padding: 12px 0 18px;
        }

        /* ── MAIN ── */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        /* ── HEADER ── */
        .header {
            height: 78px;
            border-bottom: 2px solid var(--negro-borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background-color: var(--verde-panel);
            z-index: 10;
            flex-shrink: 0;
            flex-wrap: nowrap;
            overflow: hidden;
            gap: 6px;
        }

        .user-info {
            font-size: 13px;
            line-height: 1.7;
            min-width: 150px;
        }

        .user-info strong { font-weight: 700; }

        .valor {
            color: var(--gris-ph);
            font-style: italic;
        }

        .valor.activo {
            color: inherit;
            font-style: normal;
        }

        .social-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .asociacion-titulo {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
        }

        .social-icons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .social-icons a {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .social-icons a:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
        }

        .social-icons a svg { width: 36px; height: 36px; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .logo-safime {
            height: 200px;
            width: auto;
            max-width: 160px;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
        }

        .settings-icon {
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.35s;
            flex-shrink: 0;
            line-height: 1;
        }

        .settings-icon:hover { transform: rotate(65deg); }

        /* ── ÁREA VOLUNTARIADO ── */
        .volunteer-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .fime-bg-logo {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 570px;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        /* ── PANELES ── */
        .vol-panel {
            background-color: var(--verde-panel);
            border: 2px solid var(--negro-borde);
            padding: 28px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
            border-radius: 5px;
        }

        .panel-left {
            width: 50%;
            height: 480px;
        }

        .panel-right {
            width: 28%;
            height: 480px;
        }

        .title-vol {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            margin-top: 0;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .select-capsule {
            background-color: var(--capsula-bg);
            border: 2px solid var(--negro-borde);
            border-radius: 20px;
            padding: 5px 15px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .desc-container {
            border: 2px solid var(--negro-borde);
            padding: 15px;
            flex: 1;
            margin-bottom: 20px;
            background-color: rgba(255,255,255,0.05);
            border-radius: 4px;
        }

        .desc-container strong {
            font-family: 'Playfair Display', serif;
            font-size: 15px;
        }

        .desc-textarea {
            width: 100%;
            height: 150px;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Nunito', sans-serif;
            font-style: italic;
            resize: none;
            font-size: 0.95rem;
            margin-top: 8px;
        }

        .num-box {
            width: 55px;
            height: 40px;
            border: 2px solid var(--negro-borde);
            background-color: rgba(255,255,255,0.15);
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            font-family: 'Nunito', sans-serif;
            border-radius: 6px;
            outline: none;
        }

        .display-square {
            width: 60px;
            height: 60px;
            border: 2px solid var(--negro-borde);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 1.3rem;
            margin-top: 5px;
            background-color: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        .btn-beige {
            background-color: #f3d4b1;
            border: 2px solid var(--negro-borde);
            border-radius: 15px;
            padding: 8px 30px;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            cursor: pointer;
            align-self: center;
            transition: all 0.25s ease;
        }

        .btn-beige:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 14px rgba(255,255,255,0.6);
            transform: scale(1.04);
        }

        .mini-logo-aso {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 58px;
            border-radius: 50%;
            border: 1.5px solid var(--negro-borde);
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
            text-align: center;
        }

        .status-grid strong {
            font-family: 'Playfair Display', serif;
            font-size: 14px;
        }

        /* ── RESPONSIVO MÓVIL ── */
        @media (max-width: 700px) {
            body {
                flex-direction: column;
                overflow-y: auto;
            }

            .sidebar {
                width: 100%;
                min-width: unset;
                flex-direction: row;
                flex-wrap: nowrap;
                overflow: hidden;
                justify-content: center;
                padding: 10px;
                border-right: none;
                border-bottom: 2px solid var(--negro-borde);
            }

            .logo-sigae {
                width: 70px;
                height: 70px;
                margin: 0 10px 0 0;
            }

            .nav-buttons {
                flex-direction: row;
                flex-wrap: nowrap;
                overflow: hidden;
                justify-content: center;
                gap: 6px;
                width: auto;
            }

            .btn-nav {
                font-size: 12px;
                padding: 7px 10px;
            }

            .logout-container {
                width: auto;
                padding: 0;
            }

            .main-content { overflow: visible; }

            .header {
                flex-direction: column;
                align-items: flex-start;
                padding: 10px 12px;
                height: auto;
            }

            .volunteer-area {
                flex-direction: column;
                overflow: visible;
                padding: 14px 10px;
            }

            .panel-left,
            .panel-right {
                width: 98%;
                height: auto;
            }

            .fime-bg-logo { width: 280px; }
        }
    </style>
</head>

<body>

    <!-- ══ SIDEBAR ══ -->
    <aside class="sidebar">
        <img src="../Img/Logo de equipo.jpeg" alt="Logo SIGAE" class="logo-sigae">
        <nav class="nav-buttons">
            <a href="Inicio.html" class="btn-nav">Inicio</a>
            <a href="Miembros.html" class="btn-nav">Miembros</a>
            <a href="Administrador.html" class="btn-nav">Administradores</a>
            <a href="Crea_Event.html" class="btn-nav">Eventos</a>
            <a href="Crear_QR.html" class="btn-nav">QR</a>
            <a href="Lista_Asisten.html" class="btn-nav">Lista de asistencia</a>
            <a href="Voluntariado.html" class="btn-nav active">Voluntariado</a>
        </nav>
        <div class="logout-container">
            <a href="../Login.html" class="btn-nav" style="display:block;">Cerrar sesión</a>
        </div>
    </aside>

    <!-- ══ MAIN ══ -->
    <div class="main-content">

        <!-- HEADER -->
        <header class="header">
            <div class="user-info">
                <strong>Nombre:</strong> <span id="user-nombre" class="valor">Usuario</span><br>
                <strong>Correo:</strong> <span id="user-correo" class="valor">correo@ejemplo.com</span>
            </div>

            <div class="social-center">
                <span class="asociacion-titulo">Asociación Cadereyta</span>
                <div class="social-icons">
                    <a href="#" target="_blank" title="WhatsApp" style="background:#25D366; border-radius:10px;">
                        <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
                            <path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.532 5.862L.057 23.428a.5.5 0 00.609.61l5.692-1.463A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.885 0-3.65-.502-5.177-1.381l-.36-.215-3.735.96.99-3.645-.236-.374A9.96 9.96 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
                        </svg>
                    </a>
                    <a href="#" target="_blank" title="Instagram" style="background:linear-gradient(135deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%); border-radius:10px;">
                        <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">

                        </svg>
                    </a>
                </div>
            </div>

            <div class="header-right">
                <img src="../Img/SAFIMEpng.png" alt="SAFIME" class="logo-safime">
                <i class="fa-solid fa-gear settings-icon" title="Configuración" onclick="irAConfig()"></i>
            </div>
        </header>

        <!-- ÁREA VOLUNTARIADO -->
        <div class="volunteer-area">
            <img src="../Img/fime-logo-cel.png" alt="FIME fondo" class="fime-bg-logo">

            <!-- Panel izquierdo: crear -->
            <section class="vol-panel panel-left">
                <h1 class="title-vol">Voluntariado</h1>

                <div class="input-row">
                    <strong>Evento:</strong>
                    <select id="reg-evento" class="select-capsule">
                        <option value="Evento 4">Evento 4</option>
                        <option value="Evento 5">Evento 5</option>
                    </select>
                </div>

                <div class="desc-container">
                    <strong>Descripción:</strong>
                    <textarea id="reg-desc" class="desc-textarea">"Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam..."</textarea>
                </div>

                <div style="display:flex; justify-content:center; gap:40px; margin-bottom:18px;">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <strong>Voluntarios:</strong>
                        <input type="number" id="reg-max" class="num-box" value="11">
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <strong>Puntos:</strong>
                        <input type="number" id="reg-pts" class="num-box" value="3">
                    </div>
                </div>

                <button class="btn-beige" onclick="crearRegistro()">Crear</button>
            </section>

            <!-- Panel derecho: consulta -->
            <section class="vol-panel panel-right">
                <div class="input-row">
                    <strong>Evento:</strong>
                    <select id="search-evento" class="select-capsule" onchange="actualizarConsulta()"></select>
                    <button class="btn-beige" style="padding:5px 12px;" onclick="descargarLista()">Voluntarios</button>
                </div>

                <div class="status-grid">
                    <div style="grid-column:1/span 2; display:flex; flex-direction:column; align-items:center;">
                        <strong>Máximo</strong>
                        <div id="view-max" class="display-square">0</div>
                    </div>
                    <div style="display:flex; flex-direction:column; align-items:center;">
                        <strong>Registrados</strong>
                        <div id="view-reg" class="display-square">0</div>
                    </div>
                    <div style="display:flex; flex-direction:column; align-items:center;">
                        <strong>Puntos</strong>
                        <div id="view-pts" class="display-square">0</div>
                    </div>
                </div>

                <img src="../Img/Logo de la Aso.jpeg" alt="Logo Aso" class="mini-logo-aso">
            </section>
        </div>
    </div>

    <script>
        /* ── SESIÓN ── */
        function setUsuario(nombre, correo) {
            const elN = document.getElementById('user-nombre');
            const elC = document.getElementById('user-correo');
            if (nombre) { elN.textContent = nombre; elN.classList.add('activo'); }
            if (correo) { elC.textContent = correo; elC.classList.add('activo'); }
        }
        setUsuario(
            sessionStorage.getItem('nombre'),
            sessionStorage.getItem('correo')
        );

        function irAConfig() {
            sessionStorage.setItem('paginaAnterior', window.location.href);
            window.location.href = '../Configuracion.html';
        }

        /* ── LÓGICA VOLUNTARIADO ── */
        let voluntariados = [
            { id: "Evento 4", desc: "Apoyo en logística de evento deportivo.", max: 11, reg: 7, pts: 3 }
        ];

        function crearRegistro() {
            const evento = document.getElementById('reg-evento').value;
            const desc   = document.getElementById('reg-desc').value;
            const max    = document.getElementById('reg-max').value;
            const pts    = document.getElementById('reg-pts').value;
            voluntariados = voluntariados.filter(v => v.id !== evento);
            voluntariados.push({ id: evento, desc, max, reg: 0, pts });
            alert("¡Registro de voluntariado creado!");
            cargarSelect();
        }

        function cargarSelect() {
            const select = document.getElementById('search-evento');
            select.innerHTML = '';
            voluntariados.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.id;
                opt.textContent = v.id;
                select.appendChild(opt);
            });
            actualizarConsulta();
        }

        function actualizarConsulta() {
            const val  = document.getElementById('search-evento').value;
            const data = voluntariados.find(v => v.id === val);
            if (data) {
                document.getElementById('view-max').textContent = data.max;
                document.getElementById('view-reg').textContent = data.reg;
                document.getElementById('view-pts').textContent = data.pts;
            }
        }

        function descargarLista() {
            const evento = document.getElementById('search-evento').value;
            alert("Descargando lista de inscritos para: " + evento + "\nSincronizando con la nube...");
        }

        window.onload = cargarSelect;
    </script>
</body>

</html>

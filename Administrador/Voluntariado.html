<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voluntariado - SIGAE</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --verde-fondo: #8b907c;
            --verde-paneles: #8a9b6e;
            --cafe-botones: #8b5e3c;
            --borde-negro: #1a1a1a;
            --capsula-bg: #adbca1;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Lora', serif;
            background-color: var(--verde-fondo);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 220px;
            border-right: 2px solid var(--borde-negro);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            background-color: var(--verde-paneles);
        }

        .logo-sigae { width: 100px; margin-bottom: 20px; border-radius: 50%; }

        .nav-buttons { display: flex; flex-direction: column; gap: 12px; width: 85%; }

        .btn-nav {
            background-color: var(--cafe-botones);
            border: 2px solid var(--borde-negro);
            padding: 8px;
            font-family: 'Lora', serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            color: black;
        }

        .btn-nav:hover {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        .logout-container { margin-top: auto; width: 85%; padding-bottom: 20px; }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            height: 110px;
            border-bottom: 2px solid var(--borde-negro);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background-color: var(--verde-paneles);
        }

        .social-center { text-align: center; flex: 1; }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 28px;
            margin-top: 5px;
        }

        .fa-whatsapp { color: #25D366; }
        .fa-instagram { color: #E1306C; }

        .logo-safime { height: 75px; }

        .volunteer-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 20px;
            z-index: 1;
        }

        .fime-bg-logo {
            position: absolute;
            left: 50%;
            top: 55%;
            transform: translate(-50%, -50%);
            width: 500px;
            opacity: 0.1;
            z-index: 0;
            pointer-events: none;
        }

        .vol-panel {
            background-color: rgba(138, 155, 110, 0.95);
            border: 2px solid var(--borde-negro);
            padding: 30px;
            border-radius: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .panel-left { width: 55%; height: 500px; }
        .panel-right { width: 30%; height: 500px; }

        .title-vol { font-size: 2.2rem; font-weight: bold; margin-bottom: 20px; }

        .input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }

        .label-text { font-weight: bold; font-size: 1.1rem; }

        .select-capsule {
            background-color: var(--capsula-bg);
            border: 2px solid var(--borde-negro);
            border-radius: 20px;
            padding: 8px 15px;
            font-family: 'Lora', serif;
            outline: none;
            cursor: pointer;
        }

        .desc-container {
            border: 2px solid var(--borde-negro);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            flex: 1;
        }

        .desc-textarea {
            width: 100%;
            height: 150px;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Lora', serif;
            font-style: italic;
            resize: none;
        }

        .small-input {
            width: 60px;
            text-align: center;
            background-color: var(--capsula-bg);
            border: 2px solid var(--borde-negro);
            padding: 5px;
        }

        .btn-crear, .btn-lista {
            background-color: #f3d4b1;
            border: 2px solid var(--borde-negro);
            border-radius: 15px;
            padding: 10px 30px;
            font-weight: bold;
            font-family: 'Lora', serif;
            cursor: pointer;
            transition: 0.3s;
            margin: 10px auto 0;
        }

        .btn-crear:hover, .btn-lista:hover { box-shadow: 0 0 10px white; }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
            text-align: center;
        }

        .status-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .mini-square {
            width: 50px;
            height: 50px;
            border: 2px solid var(--borde-negro);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .mini-logo-aso {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 55px;
            border-radius: 50%;
        }

    </style>
</head>
<body>

    <aside class="sidebar">
        <img src="Img/Logo de equipo.jpeg" alt="Logo SIGAE" class="logo-sigae">
        <nav class="nav-buttons">
            <a href="Inicio.html" class="btn-nav">Inicio</a>
            <a href="Miembros.html" class="btn-nav">Miembros</a>
            <a href="Administradores.html" class="btn-nav">Administradores</a>
            <a href="Eventos.html" class="btn-nav">Eventos</a>
            <a href="Crear_QR.html" class="btn-nav">QR</a>
            <a href="Lista_Asisten.html" class="btn-nav">Lista de asistencia</a>
            <a href="Voluntariado.html" class="btn-nav" style="box-shadow: 0 0 10px white;">Voluntariado</a>
        </nav>
        <div class="logout-container">
            <a href="../Login.html" class="btn-nav" style="display: block;">Cerrar sesión</a>
        </div>
    </aside>

    <div class="main-content">
        <header class="header">
            <div class="user-info">
                <strong>Nombre:</strong> Salazar Slytherin<br>
                <strong>Correo:</strong> Sa_sly95_12@gamil.com
            </div>

            <div class="social-center">
                <span style="font-weight: bold; font-size: 1.1rem;">Asociación Cadereyta</span>
                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>

            <div class="header-right">
                <img src="Img/SAFIMEpng.png" alt="SAFIME" class="logo-safime">
                <i class="fa-solid fa-gear settings-icon"></i>
            </div>
        </header>

        <img src="Img/fime-logo-cel.png" alt="FIME Background" class="fime-bg-logo">

        <main class="volunteer-container">
            
            <section class="vol-panel panel-left">
                <h1 class="title-vol">Voluntariado</h1>
                <div class="input-row">
                    <span class="label-text">Evento:</span>
                    <select class="select-capsule">
                        <option>Evento 4</option>
                        <option>Evento 5</option>
                    </select>
                </div>

                <div class="desc-container">
                    <span class="label-text">Descripción:</span>
                    <textarea class="desc-textarea" placeholder="Escribe aquí lo que se necesita del voluntariado..."></textarea>
                </div>

                <div style="display: flex; justify-content: center; gap: 40px; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span class="label-text">Voluntarios:</span>
                        <input type="number" class="small-input" value="11">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span class="label-text">puntos:</span>
                        <input type="number" class="small-input" value="3">
                    </div>
                </div>

                <button class="btn-crear" onclick="alert('Registro de voluntariado creado')">Crear</button>
            </section>

            <section class="vol-panel panel-right">
                <div class="input-row">
                    <span class="label-text">Evento:</span>
                    <select class="select-capsule">
                        <option>Evento 4</option>
                    </select>
                    <button class="btn-lista" onclick="descargarLista()">Voluntarios</button>
                </div>

                <div class="status-grid">
                    <div class="status-box" style="grid-column: 1 / span 2;">
                        <span class="label-text">Maximo</span>
                        <div class="mini-square">11</div>
                    </div>
                    <div class="status-box">
                        <span class="label-text">Registrados</span>
                        <div class="mini-square">7</div>
                    </div>
                    <div class="status-box">
                        <span class="label-text">puntos</span>
                        <div class="mini-square">3</div>
                    </div>
                </div>

                <img src="Img/Logo de la Aso.jpeg" alt="Aso Logo" class="mini-logo-aso">
            </section>

        </main>
    </div>

    <script>
        function descargarLista() {
            alert("Preparando lista de voluntarios...");
            setTimeout(() => {
                alert("Lista descargada y enviada a la nube exitosamente para consulta pública.");
            }, 800);
        }
    </script>
</body>
</html>

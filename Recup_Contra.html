<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - SIGAE</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Lora', serif;
            background-color: #8b907c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .fime-logo {
            position: absolute;
            width: 350px;
            opacity: 0.4;
            z-index: 1;
        }

        .logo-left { 
            left: -50px; 
            margin-top: 250px;
        }
        .logo-right { 
            right: -50px; 
            margin-top: -250px;
        }

        .container {
            background-color: #8a9b6e;
            border: 2px solid #000;
            border-radius: 40px;
            padding: 30px;
            width: 380px;
            text-align: center;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.2);
            z-index: 2;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: bold;
        }

        .bear-logo {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 0;
            box-sizing: border-box;
            font-size: 16px;
            font-family: 'Lora', serif;
        }

        .instruction-text {
            font-size: 14px;
            margin: 20px 0;
            line-height: 1.4;
            padding: 0 10px;
        }

        .btn-submit {
            background-color: #d9b99b;
            border: 1px solid #000;
            padding: 12px 15px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 70%;
            font-family: 'Lora', serif;
            display: inline-block;
            text-decoration: none;
            color: #000;
        }

        .btn-submit:hover {
            background-color: #c7a588;
        }

        .footer-links {
            margin-top: 25px;
        }

        .link-blue {
            color: #0000ee;
            text-decoration: none;
            font-size: 15px;
        }

        .link-blue:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <img src="Img/fime-logo-cel.png" alt="Logo FIME" class="fime-logo logo-left">
    <img src="Img/fime-logo-cel.png" alt="Logo FIME" class="fime-logo logo-right">

    <div class="container">
        <h1>SIGAE</h1>
        
        <img src="Img/Logo de equipo.jpeg" alt="Logo Oso" class="bear-logo">

        <div class="input-group">
            <label for="email">Correo:</label>
            <input type="email" id="email" required>
        </div>

        <p class="instruction-text">
            “Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.”
        </p>

        <a href="Verf_Contra.html" class="btn-submit" id="sendBtn">
            Enviar correo para restablecer contraseña
        </a>

        <div class="footer-links">
            <a href="Login.html" class="link-blue">Volver al inicio</a>
        </div>
    </div>

    <script>
        document.getElementById('sendBtn').addEventListener('click', function(e) {
            const email = document.getElementById('email').value;
            
            if(email === "") {
                e.preventDefault();
                alert("Por favor, ingresa tu correo electrónico.");
            } else {
                alert("Se ha enviado el enlace a: " + email);
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administradores - SIGAE</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --verde-fondo: #8b907c;
            --verde-paneles: #8a9b6e;
            --cafe-botones: #8b5e3c;
            --borde-negro: #1a1a1a;
            --capsula-bg: #adbca1;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Lora', serif;
            background-color: var(--verde-fondo);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 220px;
            border-right: 2px solid var(--borde-negro);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            background-color: var(--verde-paneles);
        }

        .logo-sigae { width: 100px; margin-bottom: 20px; border-radius: 50%; }

        .nav-buttons { display: flex; flex-direction: column; gap: 12px; width: 85%; }

        .btn-nav {
            background-color: var(--cafe-botones);
            border: 2px solid var(--borde-negro);
            padding: 8px;
            font-family: 'Lora', serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            color: black;
        }

        .btn-nav:hover {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        .logout-container { margin-top: auto; width: 85%; padding-bottom: 20px; }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            height: 110px;
            border-bottom: 2px solid var(--borde-negro);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background-color: var(--verde-paneles);
        }

        .social-center { text-align: center; flex: 1; }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 28px;
            margin-top: 5px;
        }

        .fa-whatsapp { color: #25D366; }
        .fa-instagram { color: #E1306C; }

        .logo-safime { height: 70px; }

        .settings-icon { font-size: 25px; color: #333; cursor: default; }

        .admin-container {
            flex: 1;
            display: flex;
            padding: 30px;
            gap: 40px;
            z-index: 1;
        }

        .fime-bg-logo {
            position: absolute;
            left: 50%;
            top: 55%;
            transform: translate(-50%, -50%);
            width: 500px;
            opacity: 0.1;
            z-index: 0;
            pointer-events: none;
        }

        .panel {
            background-color: rgba(138, 155, 110, 0.95);
            border: 2px solid var(--borde-negro);
            padding: 20px;
            border-radius: 5px;
        }

        .left-panel { flex: 1.2; }
        .right-panel { flex: 1; height: fit-content; display: flex; flex-direction: column; gap: 20px; }

        .admin-row {
            display: grid;
            grid-template-columns: 45px 1fr 45px;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }

        .capsule {
            background-color: var(--capsula-bg);
            border: 2px solid var(--borde-negro);
            border-radius: 20px;
            padding: 8px;
            text-align: center;
        }

        .select-circle {
            width: 30px;
            height: 30px;
            border: 2px solid var(--borde-negro);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            transition: 0.2s;
        }

        .select-circle.active { background-color: var(--borde-negro); box-shadow: inset 0 0 0 4px var(--capsula-bg); }

        .form-group {
            display: grid;
            grid-template-columns: 120px 1fr;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-capsule {
            background-color: var(--capsula-bg);
            border: 2px solid var(--borde-negro);
            border-radius: 20px;
            padding: 8px 15px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            font-family: 'Lora', serif;
        }

        .btn-action {
            padding: 10px 30px;
            border-radius: 20px;
            border: 2px solid var(--borde-negro);
            font-weight: bold;
            cursor: pointer;
            font-family: 'Lora', serif;
            transition: 0.3s;
            margin: 10px auto;
            display: block;
        }

        .btn-create { background-color: #f3d4b1; width: 150px; }
        .btn-delete { background-color: #ff0000; color: white; width: 180px; }
        .btn-action:hover { box-shadow: 0 0 10px white; }

        .divider { border: 1px solid var(--borde-negro); margin: 10px 0; }

        .mini-logo-aso { width: 55px; border-radius: 50%; align-self: flex-end; }

    </style>
</head>
<body>

    <aside class="sidebar">
        <img src="Img/Logo de equipo.jpeg" alt="Logo SIGAE" class="logo-sigae">
        <nav class="nav-buttons">
            <a href="Inicio.html" class="btn-nav">Inicio</a>
            <a href="Miembros.html" class="btn-nav">Miembros</a>
            <a href="Administrador.html" class="btn-nav" style="box-shadow: 0 0 10px white;">Administradores</a>
            <a href="Crea_Event.html" class="btn-nav">Eventos</a>
            <a href="Crea_Event.html" class="btn-nav">QR</a>
            <a href="Lista_Asisten.html" class="btn-nav">Lista de asistencia</a>
            <a href="Voluntariado.html" class="btn-nav">Voluntariado</a>
        </nav>
        <div class="logout-container">
            <a href="Login.html" class="btn-nav" style="display: block;">Cerrar sesión</a>
        </div>
    </aside>

    <div class="main-content">
        <header class="header">
            <div class="user-info">
                <strong>Nombre:</strong> Roberto Juarez<br>
                <strong>Correo:</strong> Rob_Arez74@gamil.com
            </div>

            <div class="social-center">
                <span style="font-weight: bold; font-size: 1.1rem;">Asociación Cadereyta</span>
                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>

            <div class="header-right" style="display: flex; align-items: center; gap: 15px;">
                <img src="Img/SAFIMEpng.png" alt="SAFIME" class="logo-safime">
                <i class="fa-solid fa-gear settings-icon"></i>
            </div>
        </header>

        <img src="Img/fime-logo-cel.png" alt="FIME Background" class="fime-bg-logo">

        <main class="admin-container">
            
            <section class="panel left-panel">
                <h3 style="text-align: center; margin-top: 0;">Administradores</h3>
                <div class="admin-row" style="font-weight: bold; text-align: center;">
                    <span>ID</span><span>Nombre:</span><span></span>
                </div>
                <div id="admin-list">
                    </div>
            </section>

            <section class="panel right-panel">
                <div id="create-section">
                    <div class="form-group">
                        <label>Administrador:</label>
                        <input type="text" id="new-name" class="input-capsule">
                    </div>
                    <div class="form-group">
                        <label>Correo:</label>
                        <input type="email" id="new-email" class="input-capsule">
                    </div>
                    <div class="form-group">
                        <label>Contraseña:</label>
                        <input type="password" id="new-pass" class="input-capsule">
                    </div>
                    <button class="btn-action btn-create" onclick="createAdmin()">Crear</button>
                </div>

                <div class="divider"></div>

                <div id="delete-section" style="text-align: center;">
                    <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px;">
                        <span>ID:</span>
                        <div class="select-circle" id="id-display" style="cursor: default;">-</div>
                    </div>
                    <button class="btn-action btn-delete" onclick="safeDelete()">Eliminar Cuenta</button>
                </div>

                <img src="Img/Logo de la Aso.jpeg" alt="Aso Logo" class="mini-logo-aso">
            </section>

        </main>
    </div>

    <script>
        let admins = [
            { id: 1, name: "Roberto Juarez" },
            { id: 2, name: "Espinosa Uriel" },
            { id: 3, name: "Daniel Gustavo" },
            { id: 5, name: "Ricardo Homar" },
            { id: 6, name: "Hector Ricardo" }
        ];

        let selectedAdminId = null;

        function renderAdmins() {
            const list = document.getElementById('admin-list');
            list.innerHTML = '';
            admins.forEach(admin => {
                const row = document.createElement('div');
                row.className = 'admin-row';
                row.innerHTML = `
                    <div class="capsule">${admin.id}</div>
                    <div class="capsule">${admin.name}</div>
                    <div class="select-circle ${selectedAdminId === admin.id ? 'active' : ''}" 
                         onclick="selectAdmin(${admin.id})"></div>
                `;
                list.appendChild(row);
            });
        }

        function selectAdmin(id) {
            selectedAdminId = id;
            document.getElementById('id-display').innerText = id;
            renderAdmins();
        }

        function createAdmin() {
            const name = document.getElementById('new-name').value;
            const email = document.getElementById('new-email').value;
            const pass = document.getElementById('new-pass').value;

            if(!name || !email || !pass) return alert("Completa todos los campos");

            const newId = admins.length > 0 ? Math.max(...admins.map(a => a.id)) + 1 : 1;
            admins.push({ id: newId, name: name });
            
            document.getElementById('new-name').value = '';
            document.getElementById('new-email').value = '';
            document.getElementById('new-pass').value = '';
            
            renderAdmins();
            alert("Administrador creado con éxito");
        }

        function safeDelete() {
            if(!selectedAdminId) return alert("Selecciona un administrador de la lista");

            const confirmPass = prompt("Para eliminar esta cuenta, por favor ingresa tu contraseña de Administrador:");
            
            if (confirmPass === "1234") { 
                admins = admins.filter(a => a.id !== selectedAdminId);
                selectedAdminId = null;
                document.getElementById('id-display').innerText = "-";
                renderAdmins();
                alert("Cuenta eliminada correctamente.");
            } else if (confirmPass !== null) {
                alert("Contraseña incorrecta. No tienes permiso para borrar esta cuenta.");
            }
        }

        renderAdmins();
    </script>
</body>
</html>

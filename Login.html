<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet">
    <title>Login SIGAE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Lora', serif;
            background-color: #8b907c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .fime-logo {
            position: absolute;
            width: 350px; 
            opacity: 0.4;
            z-index: 1;
        }

        .logo-left {
            left: -50px;
            margin-top: 250px;
        }

        .logo-right {
            right: -50px;
            margin-top: -250px;
        }

        .login-container {
            background-color: #8a9b6e;
            border: 2px solid #000;
            border-radius: 40px;
            padding: 30px;
            width: 350px;
            text-align: center;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.2);
            z-index: 2;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: bold;
        }

        .bear-logo {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            border-radius: 50%;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"], 
        input[type="password"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 0;
            box-sizing: border-box;
            font-size: 16px;
        }

        select {
            margin-top: 10px;
            background-color: white;
            cursor: pointer;
            text-align: center;
        }
        .btn-login {
            background-color: #e6c7a1;
            border: 1px solid #000;
            padding: 10px 25px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            width: 60%;
        }

        .btn-login:hover {
            background-color: #c7a588;
        }

        .footer-links {
            margin-top: 20px;
            font-size: 14px;
        }

        .footer-links p {
            margin: 5px 0;
        }

        .link-blue {
            color: #0000ee;
            text-decoration: none;
            cursor: pointer;
        }

        .link-blue:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <img src="Img/fime-logo-cel.png" alt="Logo FIME Izquierdo" class="fime-logo logo-left">
    <img src="Img/fime-logo-cel.png" alt="Logo FIME Derecho" class="fime-logo logo-right">

    <div class="login-container">
        <h1>SIGAE</h1>
        
        <img src="Img/Logo de equipo.jpeg" alt="Logo Oso" class="bear-logo">

        <form id="loginForm">
            <div class="input-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>
            </div>

            <select id="userType">
                <option value="miembro">Miembro</option>
                <option value="admin">Administrador</option>
            </select>

            <br>
            <button type="button" class="btn-login" id="loginBtn">Iniciar sesión</button>
        </form>

        <div class="footer-links">
            <p>Necesitas una Cuenta? <a href="Registro.html" class="link-blue">Regístrate</a></p>
            <p><a href="Recup_Contra.html" class="link-blue">¿Olvidaste la contraseña?</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', function() {
            const nombre = document.getElementById('nombre').value;
            const pass = document.getElementById('password').value;
            const tipo = document.getElementById('userType').value;

            if(nombre === "" || pass === "") {
                alert("Por favor llena todos los campos");
            } else {
                console.log("Iniciando sesión como: " + tipo);
                
                alert("Redirigiendo a la ventana de " + tipo);
            }
        });
    </script>

</body>
</html>

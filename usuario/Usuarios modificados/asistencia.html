<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia - SIGAE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/estiloasistencia.css">
    <style>
        :root {
            --verde-fondo: #c8cdb8;
            --verde-paneles: #8a9b6e;
            --cafe-botones: #8b5e3c;
            --borde-negro: #1a1a1a;
            --capsula-bg: #adbca1;
            --panel-bg: rgba(138, 155, 110, 0.93);
            --gris-ph: #888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Lora', serif;
            background-color: var(--verde-fondo);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 175px;
            flex-shrink: 0;
            border-right: 2px solid var(--borde-negro);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            background-color: var(--verde-paneles);
        }

        .logo-sigae { width: 90px; margin-bottom: 18px; border-radius: 50%; }

        .nav-buttons { display: flex; flex-direction: column; gap: 10px; width: 85%; }

        .btn-nav {
            background-color: var(--cafe-botones);
            border: 2px solid var(--borde-negro);
            padding: 9px 6px;
            font-family: 'Lora', serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            color: black;
            font-size: 13px;
            display: block;
        }

        .btn-nav:hover, .btn-nav.active {
            box-shadow: 0 0 15px rgba(255,255,255,0.8);
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        .logout-container { margin-top: auto; width: 85%; padding-bottom: 18px; }

        /* ── MAIN ── */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── HEADER — igual que Inicio ── */
        .header {
            height: 78px;
            border-bottom: 2px solid var(--borde-negro);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background-color: var(--verde-paneles);
            flex-shrink: 0;
            flex-wrap: nowrap;
            overflow: hidden;
            gap: 6px;
        }

        .user-info {
            font-size: 13px;
            line-height: 1.7;
            min-width: 150px;
            font-family: 'Nunito', sans-serif;
        }

        .user-info strong { font-weight: 700; }

        .valor { color: var(--gris-ph); font-style: italic; }
        .valor.activo { color: inherit; font-style: normal; }

        .social-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .asociacion-titulo {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
        }

        .social-icons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .social-icons a {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .social-icons a:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
        }

        .social-icons a svg { width: 36px; height: 36px; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .logo-safime {
            height: 200px;
            width: auto;
            max-width: 160px;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
        }

        .settings-icon {
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.35s;
            flex-shrink: 0;
            line-height: 1;
        }

        .settings-icon:hover { transform: rotate(65deg); }

        /* ── CONTENT ── */
        .content-area {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .fime-bg-logo {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 520px;
            opacity: 0.12;
            z-index: 0;
            pointer-events: none;
        }

        /* ── PANEL QR ── */
        .qr-panel {
            position: relative;
            z-index: 1;
            background-color: var(--panel-bg);
            border: 2px solid var(--borde-negro);
            border-radius: 6px;
            width: 78%;
            max-width: 920px;
            height: 78%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
            padding: 40px;
        }

        .qr-title {
            font-size: 1.6rem;
            font-weight: bold;
            text-align: center;
            line-height: 1.5;
        }

        .btn-camara {
            background-color: transparent;
            border: 2.5px dashed var(--borde-negro);
            border-radius: 30px;
            padding: 14px 70px;
            font-family: 'Lora', serif;
            font-size: 1.1rem;
            font-weight: normal;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--borde-negro);
        }

        .btn-camara:hover {
            background-color: rgba(255,255,255,0.25);
            box-shadow: 0 0 14px rgba(255,255,255,0.6);
        }

        .camera-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        .camera-container.active { display: flex; }

        video {
            width: 100%;
            max-width: 480px;
            border: 2px solid var(--borde-negro);
            border-radius: 6px;
        }

        .btn-cerrar-cam {
            background-color: #c0392b;
            color: white;
            border: 2px solid var(--borde-negro);
            border-radius: 20px;
            padding: 8px 28px;
            font-family: 'Lora', serif;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-cerrar-cam:hover { filter: brightness(1.15); }

        .scan-msg {
            font-style: italic;
            font-size: 0.95rem;
            color: #222;
        }

        .mini-logo-aso {
            position: absolute;
            bottom: 14px;
            right: 14px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 2px solid var(--borde-negro);
            object-fit: cover;
        }
    </style>
</head>
<body>

        <nav class="nav-buttons">

            <div class="header-right">
                <img src="#" alt="SAFIME" class="logo-safime">
                <i class="fa-solid fa-gear settings-icon" title="Configuración" onclick="irAConfig()"></i>
            </div>
        </header>

        <div class="content-area">
            <img src="#" alt="FIME Background" class="fime-bg-logo">

            <div class="qr-panel">
                <div id="vistaInicial" style="display:flex; flex-direction:column; align-items:center; gap:50px;">
                    <div class="qr-title">Acceso a cámara para<br>escanear QR</div>
                    <button class="btn-camara" id="btnCamara" onclick="activarCamara()">Cámara</button>
                </div>

                <div class="camera-container" id="cameraContainer">
                    <div class="qr-title">Apunta al código QR del evento</div>
                    <video id="videoStream" autoplay playsinline></video>
                    <div class="scan-msg" id="scanMsg">Buscando código QR...</div>
                    <button class="btn-cerrar-cam" onclick="cerrarCamara()">Cerrar cámara</button>
                </div>

                <img src="#" alt="Logo Aso" class="mini-logo-aso">
            </div>
        </div>
    </div>

    <script>
        function setUsuario(nombre, correo) {
            const elN = document.getElementById('user-nombre');
            const elC = document.getElementById('user-correo');
            if (nombre) { elN.textContent = nombre; elN.classList.add('activo'); }
            if (correo)  { elC.textContent = correo;  elC.classList.add('activo'); }
        }
        setUsuario(
            sessionStorage.getItem('nombre'), // <- CONEXIÓN BD: nombre
            sessionStorage.getItem('correo')  // <- CONEXIÓN BD: correo
        );

        function irAConfig() {
            sessionStorage.setItem('paginaAnterior', window.location.href);
            window.location.href = '../Configuracion.html';
        }
        
        let stream = null;

        async function activarCamara() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('videoStream').srcObject = stream;
                document.getElementById('vistaInicial').style.display = 'none';
                document.getElementById('cameraContainer').classList.add('active');
            } catch (err) {
                alert('No se pudo acceder a la cámara. Por favor permite el acceso en tu navegador.');
            }
        }

        function cerrarCamara() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            document.getElementById('videoStream').srcObject = null;
            document.getElementById('cameraContainer').classList.remove('active');
            document.getElementById('vistaInicial').style.display = 'flex';
        }
    </script>
